    function toggleGuideSubSection(sectionId) {
      const el = document.getElementById(sectionId);
      if (el) {
        if (el.classList.contains('hidden')) {
          document.querySelectorAll('.guide-subsection').forEach(s => s.classList.add('hidden'));
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      }
    }

      // Mappatura testi nelle sezioni
      document.getElementById('txt-welcome-title').innerText = t.welcomeTitle;
      document.getElementById('txt-welcome-subtitle').innerText = t.welcomeSubtitle || '';
      document.getElementById('txt-welcome-body').innerText = t.welcomeBody;
      document.getElementById('txt-btn-change-lang').innerText = t.changeLangBtn;

      document.getElementById('txt-contact-title').innerText = t.contactTitle;
      renderContactSection(lang);

      document.getElementById('txt-disclaimer-title').innerText = t.disclaimerTitle;
      document.getElementById('txt-disclaimer-body').innerText = t.disclaimerBody;

      document.getElementById('txt-wifi-title').innerText = t.wifiTitle;

      document.getElementById('txt-arrival-title').innerText = t.arrivalTitle;

      document.getElementById('txt-checkin-title').innerText = t.checkinTitle;

    function showLanguageScreen() {
      document.getElementById('app-screen').classList.add('hidden-screen');
      document.getElementById('language-screen').classList.remove('hidden-screen');
      window.scrollTo(0, 0);
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function copyWifiPassword(password, feedbackId) {
      navigator.clipboard.writeText(password).then(() => {
        const feedback = document.getElementById(feedbackId);
        feedback.classList.remove('hidden');
        setTimeout(() => feedback.classList.add('hidden'), 3000);
      });
    }
