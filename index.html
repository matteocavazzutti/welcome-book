      width: 100%;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .swiper-slide {
      width: 68px !important;
      height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0.4;
      transform: scale(0.85);
      cursor: pointer;
    }
    /* Stile Icona Centrale Attiva (Apple Dock Style) */
    .swiper-slide-active {
      opacity: 1 !important;
      transform: scale(1.25) translateY(-2px) !important;
    }
    .swiper-slide-active i {
      color: #f59e0b !important; /* Colore Amber */
    }
    .swiper-slide-active span {
      color: #0f172a !important;
      font-weight: 700 !important;
    }

    function toggleGuideSubSection(id, btnElement) {

      const isHidden = target.classList.contains('hidden');

      document.querySelectorAll('.guide-subsection').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.guide-icon').forEach(el => el.classList.remove('rotate-180'));

      if (isHidden) {
        target.classList.remove('hidden');
        if (icon) icon.classList.add('rotate-180');
      }

    function copyWifiPassword(passwordText, feedbackId) {
      navigator.clipboard.writeText(passwordText).then(() => {
        const feedback = document.getElementById(feedbackId);
        if (feedback) {
          feedback.classList.remove('hidden');
          setTimeout(() => feedback.classList.add('hidden'), 2500);
        }
      }).catch(err => {
        console.error("Errore nel copiare la password: ", err);
      });
    }

    function showLanguageScreen() {
      document.getElementById('app-screen').classList.add('hidden-screen');

      window.scrollTo(0, 0);
    }

    function initSwiperNav() {
      if (navSwiper) {
        navSwiper.destroy(true, true);
      }

      navSwiper = new Swiper('.mySwiper', {
        slidesPerView: 'auto',
        centeredSlides: true,
        slideToClickedSlide: true,
        loop: true,
        spaceBetween: 2,
        speed: 350,
        grabCursor: true,
        on: {
          init: function () {
            const activeSlide = this.slides[this.activeIndex];
            if (activeSlide) {
              const tabId = activeSlide.getAttribute('data-tab');
              if (tabId) switchTabContent(tabId);
            }
          },
          slideChange: function () {
            const activeSlide = this.slides[this.activeIndex];
            if (activeSlide) {
              const tabId = activeSlide.getAttribute('data-tab');
              if (tabId) {
                switchTabContent(tabId);
                if (!isProgrammaticSlide) {
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }
              }
            }
          }
        }
      });
    }

    function switchTabContent(tabId) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => {
        content.classList.remove('active');
      });

      const activeContent = document.getElementById(tabId);
      if (activeContent) {
        activeContent.classList.add('active');
      }
    }
  </script>
