  <!-- 4. GESTIONE DIZIONARIO & SCRIPT            -->

  <script>
    // ==========================================
    // LOGICA DI AUTENTICAZIONE E PROTEZIONE BOT
    // ==========================================
    const PIN_CODE = "1011";
    const AUTH_DURATION = 60 * 24 * 60 * 60 * 1000; // 60 giorni in millisecondi
    const LOCKOUT_DURATION = 30 * 1000; // 30 secondi di blocco
    const MAX_ATTEMPTS = 3;

    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
    });

    function checkAuth() {
      const authScreen = document.getElementById('auth-screen');
      const langScreen = document.getElementById('language-screen');
      const expiry = localStorage.getItem('terrazza_auth_expiry');

      if (expiry && parseInt(expiry) > Date.now()) {
        // Utente già autenticato
        authScreen.classList.add('hidden-screen');
        langScreen.classList.remove('hidden-screen');
      } else {
        // Utente non autenticato: gestisci input PIN
        setupPinInputs();
        checkLockoutStatus();
      }
    }

    function setupPinInputs() {
      const inputs = document.querySelectorAll('.pin-input');
      
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          // Permetti solo numeri
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
          
          if (e.target.value !== '') {
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            } else {
              // Ultima casella riempita, verifica il PIN
              validatePin();
            }
          }
        });

        // Gestione tasto Cancella per tornare indietro
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          }
        });
      });
    }

    function validatePin() {
      const inputs = document.querySelectorAll('.pin-input');
      const enteredCode = Array.from(inputs).map(i => i.value).join('');
      const errorMsg = document.getElementById('auth-error');
      const pinContainer = document.getElementById('pin-container');
      
      if (enteredCode === PIN_CODE) {
        // Successo
        localStorage.setItem('terrazza_auth_expiry', Date.now() + AUTH_DURATION);
        localStorage.removeItem('terrazza_auth_attempts'); // reset tentativi
        
        document.getElementById('auth-screen').classList.add('hidden-screen');
        document.getElementById('language-screen').classList.remove('hidden-screen');
      } else {
        // Errore
        let attempts = parseInt(localStorage.getItem('terrazza_auth_attempts') || '0');
        attempts++;
        localStorage.setItem('terrazza_auth_attempts', attempts);

        errorMsg.classList.remove('opacity-0');
        pinContainer.classList.add('shake-animation');
        
        setTimeout(() => {
          pinContainer.classList.remove('shake-animation');
        }, 400);

        setTimeout(() => {
          errorMsg.classList.add('opacity-0');
          inputs.forEach(i => i.value = '');
          
          if (attempts >= MAX_ATTEMPTS) {
            triggerLockout();
          } else {
            inputs[0].focus();
          }
        }, 1000);
      }
    }

    function triggerLockout() {
      localStorage.setItem('terrazza_auth_lockout', Date.now() + LOCKOUT_DURATION);
      localStorage.setItem('terrazza_auth_attempts', '0'); // reset per il prossimo ciclo
      checkLockoutStatus();
    }

    function checkLockoutStatus() {
      const lockoutExpiry = parseInt(localStorage.getItem('terrazza_auth_lockout') || '0');
      const now = Date.now();
      const inputs = document.querySelectorAll('.pin-input');
      const lockoutMsg = document.getElementById('auth-lockout-msg');

      if (lockoutExpiry > now) {
        // UI bloccata
        inputs.forEach(i => { i.disabled = true; i.classList.add('bg-slate-100', 'text-slate-400'); });
        lockoutMsg.classList.remove('opacity-0');
        
        const updateTimer = setInterval(() => {
          const remaining = Math.ceil((lockoutExpiry - Date.now()) / 1000);
          if (remaining <= 0) {
            clearInterval(updateTimer);
            lockoutMsg.classList.add('opacity-0');
            inputs.forEach(i => { 
              i.disabled = false; 
              i.classList.remove('bg-slate-100', 'text-slate-400'); 
              i.value = '';
            });
            inputs[0].focus();
          } else {
            lockoutMsg.innerText = `Too many attempts. Wait ${remaining}s`;
          }
        }, 1000);
      } else {
        inputs.forEach(i => { i.disabled = false; });
        if(document.getElementById('auth-screen').classList.contains('hidden-screen') === false) {
           inputs[0].focus();
        }
      }
    }

      'welcome': { icon: 'fa-house', key: 'navWelcome' },
      'arrival': { icon: 'fa-map-location-dot', key: 'navArrival' },
      'checkin': { icon: 'fa-key', key: 'navCheckin' },
      'wifi': { icon: 'fa-wifi', key: 'navWifi' },
      'rules': { icon: 'fa-clipboard-list', key: 'navRules' },
      'guide': { icon: 'fa-book-open', key: 'navGuide' },
      'transports': { icon: 'fa-bus', key: 'navTransports' },
      'tips': { icon: 'fa-utensils', key: 'navTips' },
      'enjoy': { icon: 'fa-camera-retro', key: 'navEnjoy' },
      'local-services': { icon: 'fa-location-dot', key: 'navLocalServices' },
      'checkout': { icon: 'fa-door-open', key: 'navCheckout' },
      'contact': { icon: 'fa-address-card', key: 'navContact' },

      'disclaimer': { icon: 'fa-shield-halved', key: 'navDisclaimer' }
    };

    let currentMacro = 'welcome';
    let swiperInstances = {};

    function initSwiperNav() {
      if (Object.keys(swiperInstances).length > 0) return;

      Object.keys(appStructure).forEach(macro => {
        const swiperEl = document.getElementById(`swiper-${macro}`);
        if (swiperEl) {
          swiperInstances[macro] = new Swiper(swiperEl, {
            slidesPerView: 1,
            spaceBetween: 0,
            loop: false, 
            grabCursor: true,
            on: {
              slideChange: function () {
                if (currentMacro === macro) {
                  updateTopTabsState(this.activeIndex);
                }
              }
            }
          });
        }
      });
      activateMacro('welcome');
    }

    function activateMacro(macroId) {
      currentMacro = macroId;
      
      document.querySelectorAll('.macro-btn').forEach(btn => {
        if (btn.id === `btn-macro-${macroId}`) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-amber-600', 'active-macro');
        } else {
          btn.classList.add('text-slate-400');
          btn.classList.remove('text-amber-600', 'active-macro');
        }
      });

      document.querySelectorAll('.macro-swiper').forEach(el => {
        if (el.id === `swiper-${macroId}`) {
          el.classList.remove('hidden');
          el.classList.add('block');
        } else {
          el.classList.remove('block');
          el.classList.add('hidden');
        }
      });

      renderTopTabs();
      
      if (swiperInstances[macroId]) {
        swiperInstances[macroId].update();
        updateTopTabsState(swiperInstances[macroId].activeIndex);
      }
    }

    function renderTopTabs() {
      const container = document.getElementById('top-tabs-container');
      if (!container) return;
      const chapters = appStructure[currentMacro];
      if (!chapters) return;
      
      const langCodeEl = document.getElementById('current-lang-code');
      const langCode = langCodeEl ? langCodeEl.innerText.toLowerCase() : 'it';
      const langData = translations[langCode] || translations['it'];

      container.innerHTML = chapters.map((tabId, index) => {
        const conf = tabConfig[tabId];
        if (!conf) return '';
        const isActive = swiperInstances[currentMacro] ? (swiperInstances[currentMacro].activeIndex === index) : (index === 0);
        
        return `
          <button onclick="slideToTab(${index})" id="top-tab-${index}" class="flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 ${isActive ? 'bg-amber-100 border-amber-300 text-amber-800 font-bold shadow-sm' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">
            <i class="fa-solid ${conf.icon}"></i>
            <span class="text-[11px] whitespace-nowrap">${langData[conf.key] || conf.key}</span>
          </button>
        `;
      }).join('');

      if (swiperInstances[currentMacro]) {
        scrollTabIntoView(swiperInstances[currentMacro].activeIndex);
      }
    }

    function slideToTab(index) {
      if (swiperInstances[currentMacro]) {
        swiperInstances[currentMacro].slideTo(index);
      }
    }

    function updateTopTabsState(activeIndex) {
      const tabs = document.querySelectorAll('#top-tabs-container button');
      tabs.forEach((tab, index) => {
        if (index === activeIndex) {
          tab.className = "flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 bg-amber-100 border-amber-300 text-amber-800 font-bold shadow-sm";
        } else {
          tab.className = "flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 bg-white border-slate-200 text-slate-500 hover:bg-slate-50";
        }
      });
      scrollTabIntoView(activeIndex);
    }

    function scrollTabIntoView(index) {
      const container = document.getElementById('top-tabs-container');
      const tab = document.getElementById(`top-tab-${index}`);
      if (tab && container) {
        const scrollLeft = tab.offsetLeft - (container.offsetWidth / 2) + (tab.offsetWidth / 2);
        container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
      }
    }

    function showTab(tabId) {
      let targetMacro = null;
      let targetIndex = 0;
      for (const [macro, tabs] of Object.entries(appStructure)) {
          const idx = tabs.indexOf(tabId);
          if (idx !== -1) {
              targetMacro = macro;
              targetIndex = idx;
              break;
          }
      }
      if (targetMacro) {
          activateMacro(targetMacro);
          setTimeout(() => slideToTab(targetIndex), 50);
      }
    }

      setNavText('nav-guide', t.navGuide);
      setNavText('nav-transports', t.navTransports);
      setNavText('nav-tips', t.navTips);
      setNavText('nav-enjoy', t.navEnjoy);

      setNavText('nav-checkout', t.navCheckout);
      setNavText('nav-contact', t.navContact);
      setNavText('nav-emergency', t.navEmergency);
      setNavText('nav-disclaimer', t.navDisclaimer);

      // Transizione schermata (Landing Page -> Applicazione)
// Transizione schermo
      const langScreen = document.getElementById('language-screen');
      const appScreen = document.getElementById('app-screen');
      
      if (langScreen) langScreen.classList.add('hidden-screen');
      if (appScreen) appScreen.classList.remove('hidden-screen');
      
      setTimeout(() => {
        initSwiperNav();

      // Inizializzazione navigatore Swiper
      setTimeout(() => {

    }

    let modalSwiperInstance = null;

    // Modal Fullscreen per Apertura Foto
    function openGalleryModal(gallery, startIndex = 0) {
      const modal = document.getElementById('image-modal');
      const wrapper = document.getElementById('modal-swiper-wrapper');
      if (!modal || !wrapper) return;

      wrapper.innerHTML = '';
      gallery.forEach(img => {
        const rotateClass = img.rotate ? 'rotate-90 scale-125' : '';
        wrapper.innerHTML += `
          <div class="swiper-slide flex items-center justify-center p-4">
            <img src="${img.src}" class="max-w-[95%] max-h-[85vh] object-contain rounded-2xl shadow-2xl transition-all duration-300 ${rotateClass}">
          </div>
        `;
      });

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      if (modalSwiperInstance) modalSwiperInstance.destroy(true, true);

      modalSwiperInstance = new Swiper('.modal-swiper', {
        initialSlide: startIndex,
        loop: true,
        grabCursor: true,
        spaceBetween: 20,
        navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
        pagination: { el: '.swiper-pagination', clickable: true }
      });
    }

    function openImageModal(imgSrc, isRotated = false) {
      // Funzione fallback per le foto singole che non hanno galleria (es. landing page)
      openGalleryModal([{ src: imgSrc, rotate: isRotated }], 0);
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      if (modal) {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === "Escape") {
        closeImageModal();
      }
    });

    // Inseriamo uno "stato fittizio" nella cronologia del browser all'avvio
    history.pushState({ page: 'app-started' }, '', '');

    window.addEventListener('popstate', function(event) {
      const modal = document.getElementById('image-modal');
      
      // 1. Se è aperta una foto a schermo intero, la chiude e ferma l'azione
      if (modal && !modal.classList.contains('hidden')) {
        closeImageModal();
        history.pushState({ page: 'app-started' }, '', ''); // Ricrea il blocco
        return;
      }

      // 2. Se NON siamo sul capitolo Welcome, torna a Welcome
      if (currentMacro !== 'welcome') {
        activateMacro('welcome');
        
        // Assicurati che lo swiper torni alla primissima scheda
        if (swiperInstances['welcome']) {
          swiperInstances['welcome'].slideTo(0); 
        }
        
        history.pushState({ page: 'app-started' }, '', ''); // Ricrea il blocco
      } 
      // 3. Se siamo GIA' su Welcome, non ricrea il blocco: l'app si chiuderà normalmente
    });
