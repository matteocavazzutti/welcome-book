                <div class="p-2.5 bg-emerald-100 text-emerald-600 rounded-lg flex-shrink-0">
                  <i class="fa-solid fa-dog text-lg"></i>
                </div>
                <div>
                  <h4 class="text-xs font-bold text-slate-900">Pets</h4>
                  <p class="text-xs text-slate-600 mt-0.5">Pets are not allowed in the property.</p>
                </div>
              </div>

              <!-- SECURITY OF YOUR BELONGINGS -->
              <div class="flex items-start gap-3 p-3.5 bg-slate-50 border border-slate-100 rounded-xl">
                <div class="p-2.5 bg-indigo-100 text-indigo-600 rounded-lg flex-shrink-0">
                  <i class="fa-solid fa-lock text-lg"></i>
                </div>
                <div>
                  <h4 class="text-xs font-bold text-slate-900">Security of your belongings</h4>
                  <p class="text-xs text-slate-600 mt-0.5">Every time you leave the apartment, please:</p>
                  <ul class="text-xs text-slate-600 list-disc list-inside mt-1 space-y-0.5">
                    <li>Close windows bars, windows and shutters</li>
                    <li>Switch off the AC, heater fan, and lights</li>
                    <li>Lock the front door (double-lock)</li>
                  </ul>
                </div>
              </div>

              <!-- BROKEN / LOST ITEMS POLICY -->
              <div class="flex items-start gap-3 p-3.5 bg-slate-50 border border-slate-100 rounded-xl">
                <div class="p-2.5 bg-orange-100 text-orange-600 rounded-lg flex-shrink-0">
                  <i class="fa-solid fa-wine-glass-crack text-lg"></i>
                </div>
                <div>
                  <h4 class="text-xs font-bold text-slate-900">Broken / lost items policy</h4>
                  <p class="text-xs text-slate-600 mt-0.5">Please inform us promptly of any damage or missing items. Failure to do so may result in charges for those damages.</p>
                </div>
              </div>

            </div>
          </div>
        `;
      } else {
        const t = translations[lang] || translations['it'];
        container.innerHTML = `<p class="text-sm text-slate-600 leading-relaxed whitespace-pre-line">${t.rulesBody}</p>`;
      }
    }

    function selectLanguage(lang) {
      document.getElementById('current-lang-code').innerText = lang;
      const t = translations[lang] || translations['it'];

      // Mappatura testi nelle sezioni
      document.getElementById('txt-welcome-title').innerText = t.welcomeTitle;
      document.getElementById('txt-welcome-subtitle').innerText = t.welcomeSubtitle || '';
      document.getElementById('txt-welcome-body').innerText = t.welcomeBody;
      document.getElementById('txt-btn-change-lang').innerText = t.changeLangBtn;

      document.getElementById('txt-contact-title').innerText = t.contactTitle;
      renderContactSection(lang);

      document.getElementById('txt-disclaimer-title').innerText = t.disclaimerTitle;
      document.getElementById('txt-disclaimer-body').innerText = t.disclaimerBody;

      document.getElementById('txt-wifi-title').innerText = t.wifiTitle;
      renderWifiSection(lang);

      document.getElementById('txt-arrival-title').innerText = t.arrivalTitle;
      renderArrivalSection(lang);

      document.getElementById('txt-checkin-title').innerText = t.checkinTitle;
      renderCheckinSection(lang);

      document.getElementById('txt-checkout-title').innerText = t.checkoutTitle;
      renderCheckoutSection(lang);

      document.getElementById('txt-rules-title').innerText = t.rulesTitle;
      renderRulesSection(lang);

      document.getElementById('txt-guide-title').innerText = t.guideTitle;
      document.getElementById('txt-guide-body').innerText = t.guideBody;

      document.getElementById('txt-transports-title').innerText = t.transportsTitle;
      document.getElementById('txt-transports-body').innerText = t.transportsBody;

      document.getElementById('txt-tips-title').innerText = t.tipsTitle;
      document.getElementById('txt-tips-body').innerText = t.tipsBody;

      document.getElementById('txt-emergency-title').innerText = t.emergencyTitle;
      document.getElementById('txt-emergency-body').innerText = t.emergencyBody;

      // Mappatura etichette menu in basso
      document.getElementById('nav-welcome').innerText = t.navWelcome;
      document.getElementById('nav-contact').innerText = t.navContact;
      document.getElementById('nav-disclaimer').innerText = t.navDisclaimer;
      document.getElementById('nav-wifi').innerText = t.navWifi;
      document.getElementById('nav-arrival').innerText = t.navArrival;
      document.getElementById('nav-checkin').innerText = t.navCheckin;
      document.getElementById('nav-checkout').innerText = t.navCheckout;
      document.getElementById('nav-rules').innerText = t.navRules;
      document.getElementById('nav-guide').innerText = t.navGuide;
      document.getElementById('nav-transports').innerText = t.navTransports;
      document.getElementById('nav-tips').innerText = t.navTips;
      document.getElementById('nav-emergency').innerText = t.navEmergency;

      // Mostra schermata app e nasconde landing page
      document.getElementById('language-screen').classList.add('hidden-screen');
      document.getElementById('app-screen').classList.remove('hidden-screen');
      
      showTab('welcome');
      window.scrollTo(0, 0);
    }

    function showLanguageScreen() {
      document.getElementById('app-screen').classList.add('hidden-screen');
      document.getElementById('language-screen').classList.remove('hidden-screen');
      window.scrollTo(0, 0);
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function copyWifiPassword(password, feedbackId) {
      navigator.clipboard.writeText(password).then(() => {
        const feedback = document.getElementById(feedbackId);
        feedback.classList.remove('hidden');
        setTimeout(() => feedback.classList.add('hidden'), 3000);
      });
    }
  </script>
</body>
</html>
