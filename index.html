<!DOCTYPE html>
<html lang="it">

  <title>Benvenuti alla Terrazza di Maria</title>

  <!-- Framework grafico Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icone FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>

  <!-- Swiper CSS per Navigazione -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    .hidden-screen { display: none !important; }
    
    /* Nascondi scrollbar per il menu top pur mantenendo lo scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Area sicura per iPhone (Notch/Home Indicator) */
    .pb-safe { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }

    /* Personalizzazione Macro Bottoni Bottom */
    .macro-btn {
      transition: all 0.3s ease;
    }
    .macro-btn.active-macro {
      transform: scale(1.1) translateY(-2px);
    }

    /* Animazione Scuotimento per Errore PIN */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }
    .shake-animation {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans">

  <!-- ========================================== -->
  <!-- 0. AUTHENTICATION SCREEN                   -->
  <!-- ========================================== -->
  <div id="auth-screen" class="min-h-screen max-w-md mx-auto flex flex-col justify-center items-center p-6 text-center bg-slate-50 shadow-2xl relative">

    <!-- Caselle PIN -->
    <div id="pin-container" class="flex gap-3 mb-2" dir="ltr">

  <!-- 1. LANDING PAGE: SELEZIONE LINGUA          -->

          <!-- Slide: Arrival (Spostata in Welcome) -->

            <section id="disclaimer" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">

                </div>

            <section id="transports" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">

  <!-- 4. GESTIONE DIZIONARIO & SCRIPT            -->
  <!-- ========================================== -->
  <script>
    // ==========================================
    // LOGICA DI AUTENTICAZIONE E PROTEZIONE BOT
    // ==========================================
    const PIN_CODE = "1011";
    const AUTH_DURATION = 60 * 24 * 60 * 60 * 1000;
    const LOCKOUT_DURATION = 30 * 1000;
    const MAX_ATTEMPTS = 3;

    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
    });

    function checkAuth() {
      const authScreen = document.getElementById('auth-screen');
      const langScreen = document.getElementById('language-screen');
      const expiry = localStorage.getItem('terrazza_auth_expiry');

      if (expiry && parseInt(expiry) > Date.now()) {
        if(authScreen) authScreen.classList.add('hidden-screen');
        if(langScreen) langScreen.classList.remove('hidden-screen');
      } else {
        setupPinInputs();
        checkLockoutStatus();
      }
    }

    function setupPinInputs() {
      const inputs = document.querySelectorAll('.pin-input');
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
          if (e.target.value !== '') {
            if (index < inputs.length - 1) inputs[index + 1].focus();
            else validatePin();
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          }
        });
      });
    }

    function validatePin() {
      const inputs = document.querySelectorAll('.pin-input');
      const enteredCode = Array.from(inputs).map(i => i.value).join('');
      const errorMsg = document.getElementById('auth-error');
      const pinContainer = document.getElementById('pin-container');
      
      if (enteredCode === PIN_CODE) {
        localStorage.setItem('terrazza_auth_expiry', Date.now() + AUTH_DURATION);
        localStorage.removeItem('terrazza_auth_attempts');
        document.getElementById('auth-screen').classList.add('hidden-screen');
        document.getElementById('language-screen').classList.remove('hidden-screen');
      } else {
        let attempts = parseInt(localStorage.getItem('terrazza_auth_attempts') || '0');
        attempts++;
        localStorage.setItem('terrazza_auth_attempts', attempts);
        if(errorMsg) errorMsg.classList.remove('opacity-0');
        if(pinContainer) pinContainer.classList.add('shake-animation');
        setTimeout(() => { if(pinContainer) pinContainer.classList.remove('shake-animation'); }, 400);
        setTimeout(() => {
          if(errorMsg) errorMsg.classList.add('opacity-0');
          inputs.forEach(i => i.value = '');
          if (attempts >= MAX_ATTEMPTS) triggerLockout();
          else inputs[0].focus();
        }, 1000);
      }
    }

    function triggerLockout() {
      localStorage.setItem('terrazza_auth_lockout', Date.now() + LOCKOUT_DURATION);
      localStorage.setItem('terrazza_auth_attempts', '0');
      checkLockoutStatus();
    }

    function checkLockoutStatus() {
      const lockoutExpiry = parseInt(localStorage.getItem('terrazza_auth_lockout') || '0');
      const now = Date.now();
      const inputs = document.querySelectorAll('.pin-input');
      const lockoutMsg = document.getElementById('auth-lockout-msg');

      if (lockoutExpiry > now) {
        inputs.forEach(i => { i.disabled = true; i.classList.add('bg-slate-100', 'text-slate-400'); });
        if(lockoutMsg) lockoutMsg.classList.remove('opacity-0');
        const updateTimer = setInterval(() => {
          const remaining = Math.ceil((lockoutExpiry - Date.now()) / 1000);
          if (remaining <= 0) {
            clearInterval(updateTimer);
            if(lockoutMsg) lockoutMsg.classList.add('opacity-0');
            inputs.forEach(i => { 
              i.disabled = false; 
              i.classList.remove('bg-slate-100', 'text-slate-400'); 
              i.value = '';
            });
            inputs[0].focus();
          } else {
            if(lockoutMsg) lockoutMsg.innerText = `Too many attempts. Wait ${remaining}s`;
          }
        }, 1000);
      } else {
        inputs.forEach(i => { i.disabled = false; });
        const authScreen = document.getElementById('auth-screen');
        if(authScreen && !authScreen.classList.contains('hidden-screen')) {
           if(inputs.length > 0) inputs[0].focus();
        }
      }
    }

    };

    let currentMacro = 'welcome';
    let swiperInstances = {};

    function initSwiperNav() {
      if (Object.keys(swiperInstances).length > 0) return;

      Object.keys(appStructure).forEach(macro => {
        const swiperEl = document.getElementById(`swiper-${macro}`);
        if (swiperEl) {
          swiperInstances[macro] = new Swiper(swiperEl, {
            slidesPerView: 1,
            spaceBetween: 0,
            loop: false, 
            grabCursor: true,
            observer: true,
            observeParents: true,
            on: {
              slideChange: function () {
                if (currentMacro === macro) {
                  updateTopTabsState(this.activeIndex);
                }
              }
            }
          });
        }
      });
      activateMacro('welcome');
    }

    function activateMacro(macroId) {
      currentMacro = macroId;
      
      document.querySelectorAll('.macro-btn').forEach(btn => {
        if (btn.id === `btn-macro-${macroId}`) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-amber-600', 'active-macro');
        } else {
          btn.classList.add('text-slate-400');
          btn.classList.remove('text-amber-600', 'active-macro');
        }
      });

      document.querySelectorAll('.macro-swiper').forEach(el => {
        if (el.id === `swiper-${macroId}`) {
          el.classList.remove('hidden');
          el.classList.add('block');
        } else {
          el.classList.remove('block');
          el.classList.add('hidden');
        }
      });

      renderTopTabs();
      
      if (swiperInstances[macroId]) {
        swiperInstances[macroId].update();
        updateTopTabsState(swiperInstances[macroId].activeIndex);
      }
    }

    function renderTopTabs() {
      const container = document.getElementById('top-tabs-container');
      if (!container) return;
      const chapters = appStructure[currentMacro];
      if (!chapters) return;
      
      const langCodeEl = document.getElementById('current-lang-code');
      const langCode = langCodeEl ? langCodeEl.innerText.toLowerCase() : 'it';
      const langData = translations[langCode] || translations['it'];

      container.innerHTML = chapters.map((tabId, index) => {
        const conf = tabConfig[tabId];
        if (!conf) return '';
        const isActive = swiperInstances[currentMacro] ? (swiperInstances[currentMacro].activeIndex === index) : (index === 0);
        
        return `
          <button onclick="slideToTab(${index})" id="top-tab-${index}" class="flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 ${isActive ? 'bg-amber-100 border-amber-300 text-amber-800 font-bold shadow-sm' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">
            <i class="fa-solid ${conf.icon}"></i>
            <span class="text-[11px] whitespace-nowrap">${langData[conf.key] || conf.key}</span>
          </button>
        `;
      }).join('');

      if (swiperInstances[currentMacro]) {
        scrollTabIntoView(swiperInstances[currentMacro].activeIndex);
      }
    }

    function slideToTab(index) {
      if (swiperInstances[currentMacro]) {
        swiperInstances[currentMacro].slideTo(index);
      }
    }

    function updateTopTabsState(activeIndex) {
      const tabs = document.querySelectorAll('#top-tabs-container button');
      tabs.forEach((tab, index) => {
        if (index === activeIndex) {
          tab.className = "flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 bg-amber-100 border-amber-300 text-amber-800 font-bold shadow-sm";
        } else {
          tab.className = "flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 bg-white border-slate-200 text-slate-500 hover:bg-slate-50";
        }
      });
      scrollTabIntoView(activeIndex);
    }

    function scrollTabIntoView(index) {
      const container = document.getElementById('top-tabs-container');
      const tab = document.getElementById(`top-tab-${index}`);
      if (tab && container) {
        const scrollLeft = tab.offsetLeft - (container.offsetWidth / 2) + (tab.offsetWidth / 2);
        container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
      }
    }

    function showTab(tabId) {
      let targetMacro = null;
      let targetIndex = 0;
      for (const [macro, tabs] of Object.entries(appStructure)) {
          const idx = tabs.indexOf(tabId);
          if (idx !== -1) {
              targetMacro = macro;
              targetIndex = idx;
              break;
          }
      }
      if (targetMacro) {
          activateMacro(targetMacro);
          setTimeout(() => slideToTab(targetIndex), 50);
      }
    }

    function toggleLocalServicesSubSection(sectionId, btnElement) {
      const targetContent = document.getElementById(sectionId);
      if (!targetContent) return;

      const isHidden = targetContent.classList.contains('hidden');

      document.querySelectorAll('.local-services-subsection').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.local-services-icon').forEach(icon => icon.style.transform = 'rotate(0deg)');

      if (isHidden) {
        targetContent.classList.remove('hidden');
        if (btnElement) {
          const icon = btnElement.querySelector('.local-services-icon');
          if (icon) icon.style.transform = 'rotate(180deg)';
        }
      }
    }
