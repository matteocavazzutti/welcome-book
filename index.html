  <style>
    .hidden-screen { display: none !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* Personalizzazione Swiper Dock Apple */
    .swiper {
      width: 100%;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .swiper-slide {
      width: 68px !important;
      height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0.4;
      transform: scale(0.85);
      cursor: pointer;
    }
    .swiper-slide-active {
      opacity: 1 !important;
      transform: scale(1.25) translateY(-2px) !important;
    }
    .swiper-slide-active i {
      color: #f59e0b !important;
    }
    .swiper-slide-active span {
      color: #0f172a !important;
      font-weight: 700 !important;
    }

    /* Animazione Scuotimento per Errore PIN */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }
    .shake-animation {
      animation: shake 0.4s ease-in-out;
    }
  </style>

  <!-- 4. GESTIONE DIZIONARIO & SCRIPT            -->

  <script>
    // ==========================================
    // LOGICA DI AUTENTICAZIONE E PROTEZIONE BOT
    // ==========================================
    const PIN_CODE = "1011";
    const AUTH_DURATION = 60 * 24 * 60 * 60 * 1000; // 60 giorni in millisecondi
    const LOCKOUT_DURATION = 30 * 1000; // 30 secondi di blocco
    const MAX_ATTEMPTS = 3;

    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
    });

    function checkAuth() {
      const authScreen = document.getElementById('auth-screen');
      const langScreen = document.getElementById('language-screen');
      const expiry = localStorage.getItem('terrazza_auth_expiry');

      if (expiry && parseInt(expiry) > Date.now()) {
        // Utente già autenticato
        authScreen.classList.add('hidden-screen');
        langScreen.classList.remove('hidden-screen');
      } else {
        // Utente non autenticato: gestisci input PIN
        setupPinInputs();
        checkLockoutStatus();
      }
    }

    function setupPinInputs() {
      const inputs = document.querySelectorAll('.pin-input');
      
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          // Permetti solo numeri
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
          
          if (e.target.value !== '') {
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            } else {
              // Ultima casella riempita, verifica il PIN
              validatePin();
            }
          }
        });

        // Gestione tasto Cancella per tornare indietro
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          }
        });
      });
    }

    function validatePin() {
      const inputs = document.querySelectorAll('.pin-input');
      const enteredCode = Array.from(inputs).map(i => i.value).join('');
      const errorMsg = document.getElementById('auth-error');
      const pinContainer = document.getElementById('pin-container');
      
      if (enteredCode === PIN_CODE) {
        // Successo
        localStorage.setItem('terrazza_auth_expiry', Date.now() + AUTH_DURATION);
        localStorage.removeItem('terrazza_auth_attempts'); // reset tentativi
        
        document.getElementById('auth-screen').classList.add('hidden-screen');
        document.getElementById('language-screen').classList.remove('hidden-screen');
      } else {
        // Errore
        let attempts = parseInt(localStorage.getItem('terrazza_auth_attempts') || '0');
        attempts++;
        localStorage.setItem('terrazza_auth_attempts', attempts);

        errorMsg.classList.remove('opacity-0');
        pinContainer.classList.add('shake-animation');
        
        setTimeout(() => {
          pinContainer.classList.remove('shake-animation');
        }, 400);

        setTimeout(() => {
          errorMsg.classList.add('opacity-0');
          inputs.forEach(i => i.value = '');
          
          if (attempts >= MAX_ATTEMPTS) {
            triggerLockout();
          } else {
            inputs[0].focus();
          }
        }, 1000);
      }
    }

    function triggerLockout() {
      localStorage.setItem('terrazza_auth_lockout', Date.now() + LOCKOUT_DURATION);
      localStorage.setItem('terrazza_auth_attempts', '0'); // reset per il prossimo ciclo
      checkLockoutStatus();
    }

    function checkLockoutStatus() {
      const lockoutExpiry = parseInt(localStorage.getItem('terrazza_auth_lockout') || '0');
      const now = Date.now();
      const inputs = document.querySelectorAll('.pin-input');
      const lockoutMsg = document.getElementById('auth-lockout-msg');

      if (lockoutExpiry > now) {
        // UI bloccata
        inputs.forEach(i => { i.disabled = true; i.classList.add('bg-slate-100', 'text-slate-400'); });
        lockoutMsg.classList.remove('opacity-0');
        
        const updateTimer = setInterval(() => {
          const remaining = Math.ceil((lockoutExpiry - Date.now()) / 1000);
          if (remaining <= 0) {
            clearInterval(updateTimer);
            lockoutMsg.classList.add('opacity-0');
            inputs.forEach(i => { 
              i.disabled = false; 
              i.classList.remove('bg-slate-100', 'text-slate-400'); 
              i.value = '';
            });
            inputs[0].focus();
          } else {
            lockoutMsg.innerText = `Too many attempts. Wait ${remaining}s`;
          }
        }, 1000);
      } else {
        inputs.forEach(i => { i.disabled = false; });
        if(document.getElementById('auth-screen').classList.contains('hidden-screen') === false) {
           inputs[0].focus();
        }
      }
    }

    }

    function toggleFoodDrinkSubSection(sectionId, btnElement) {
      const targetContent = document.getElementById(sectionId);
      if (!targetContent) return;

      const isHidden = targetContent.classList.contains('hidden');

      document.querySelectorAll('.food-drink-subsection').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.food-drink-icon').forEach(icon => icon.style.transform = 'rotate(0deg)');

      if (isHidden) {
        targetContent.classList.remove('hidden');
        if (btnElement) {
          const icon = btnElement.querySelector('.food-drink-icon');
          if (icon) icon.style.transform = 'rotate(180deg)';
        }
      }
    }

    function initSwiperNav() {
      if (navSwiper) return;

      navSwiper = new Swiper(".mySwiper", {
        slidesPerView: "auto",
        centeredSlides: true,
        spaceBetween: 10,
        loop: true,
        slideToClickedSlide: true,
        grabCursor: true,
        on: {
          slideChange: function () {
            const activeSlide = this.slides[this.activeIndex];
            if (activeSlide) {
              const tabId = activeSlide.getAttribute('data-tab');
              if (tabId && !isProgrammaticSlide) {
                switchTabContent(tabId);
              }
            }
          }
        }
      });
    }

    function switchTabContent(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      const activeTab = document.getElementById(tabId);
      if (activeTab) {
        activeTab.classList.add('active');
        window.scrollTo(0, 0);
      }
    }

    function showTab(tabId) {
      switchTabContent(tabId);
      if (navSwiper) {
        const tabsOrder = [
          'welcome', 'arrival', 'checkin', 'wifi', 'rules', 'guide',
          'transports', 'tips', 'local-services', 'enjoy', 'checkout', 'contact',
          'emergency', 'disclaimer'
        ];
        
        const realIndex = tabsOrder.indexOf(tabId);
        if (realIndex !== -1) {
          isProgrammaticSlide = true;
          navSwiper.slideToLoop(realIndex, 300);
          setTimeout(() => { isProgrammaticSlide = false; }, 350);
        }
      }
    }

    function selectLanguage(lang) {
      const codeEl = document.getElementById('current-lang-code');
      if (codeEl) codeEl.innerText = lang;
      
      const t = translations[lang] || translations['it'];

      const elLine1 = document.getElementById('txt-welcome-line1');
      if (elLine1) elLine1.innerText = t.welcomeLine1 || '';
      
      const elLine2 = document.getElementById('txt-welcome-line2');
      if (elLine2) elLine2.innerText = t.welcomeLine2 || '';

      const elSubTitle = document.getElementById('txt-welcome-subtitle');
      if (elSubTitle) elSubTitle.innerText = t.welcomeSubtitle || '';

      const elBody = document.getElementById('txt-welcome-body');
      if (elBody) elBody.innerText = t.welcomeBody || '';

      const btnChange = document.getElementById('txt-btn-change-lang');
      if (btnChange) btnChange.innerText = t.changeLangBtn || '';

      const enjoyTitle = document.getElementById('txt-enjoy-title');
      if (enjoyTitle) enjoyTitle.innerText = t.enjoyTitle || '';

      // Rendering di tutte le sezioni dinamiche
      const sectionsToRender = [
        { id: 'arrival', renderFn: renderArrivalSection, titleKey: 'arrivalTitle' },
        { id: 'checkin', renderFn: renderCheckinSection, titleKey: 'checkinTitle' },
        { id: 'wifi', renderFn: renderWifiSection, titleKey: 'wifiTitle' },
        { id: 'rules', renderFn: renderRulesSection, titleKey: 'rulesTitle' },
        { id: 'guide', renderFn: renderGuideSection, titleKey: 'guideTitle' },
        { id: 'transports', renderFn: renderTransportsSection, titleKey: 'transportsTitle' },
        { id: 'tips', renderFn: renderFoodDrinkSection, titleKey: 'tipsTitle' },
        { id: 'local-services', renderFn: renderLocalServicesSection, titleKey: 'localServicesTitle' },
        { id: 'checkout', renderFn: renderCheckoutSection, titleKey: 'checkoutTitle' },
        { id: 'contact', renderFn: renderContactSection, titleKey: 'contactTitle' },
        { id: 'emergency', renderFn: renderEmergencySection, titleKey: 'emergencyTitle' },
        { id: 'disclaimer', renderFn: renderDisclaimerSection, titleKey: 'disclaimerTitle' }
      ];

      sectionsToRender.forEach(sec => {
        const titleEl = document.getElementById(`txt-${sec.id}-title`);
        if (titleEl) titleEl.innerText = t[sec.titleKey] || '';
        if (sec.renderFn) sec.renderFn(lang);
      });
      
      // render Enjoy non ha un titleKey dinamico a parte enjoyTitle già gestito
      renderEnjoySection(lang);

      // Etichette dock - assegnazione precisa ed esplicita
      const setNavText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.innerText = text || '';
      };

      setNavText('nav-welcome', t.navWelcome);
      setNavText('nav-arrival', t.navArrival);
      setNavText('nav-checkin', t.navCheckin);
      setNavText('nav-wifi', t.navWifi);
      setNavText('nav-rules', t.navRules);
      setNavText('nav-guide', t.navGuide);
      setNavText('nav-transports', t.navTransports);
      setNavText('nav-tips', t.navTips);
      setNavText('nav-local-services', t.navLocalServices);
      setNavText('nav-enjoy', t.navEnjoy);
      setNavText('nav-checkout', t.navCheckout);
      setNavText('nav-contact', t.navContact);
      setNavText('nav-emergency', t.navEmergency);
      setNavText('nav-disclaimer', t.navDisclaimer);

      // Transizione schermata (Landing Page -> Applicazione)
      const langScreen = document.getElementById('language-screen');
      const appScreen = document.getElementById('app-screen');
      
      if (langScreen) langScreen.classList.add('hidden-screen');
      if (appScreen) appScreen.classList.remove('hidden-screen');
      
      // Inizializzazione navigatore Swiper
      setTimeout(() => {
        initSwiperNav();
        switchTabContent('welcome');
      }, 50);
    }

    function showLanguageScreen() {
      const appScreen = document.getElementById('app-screen');
      const langScreen = document.getElementById('language-screen');
      
      if (appScreen) appScreen.classList.add('hidden-screen');
      if (langScreen) langScreen.classList.remove('hidden-screen');
      window.scrollTo(0, 0);
    }

    function copyWifiPassword(password, feedbackId) {
      navigator.clipboard.writeText(password).then(() => {
        const feedback = document.getElementById(feedbackId);
        if (feedback) {
          feedback.classList.remove('hidden');
          setTimeout(() => feedback.classList.add('hidden'), 3000);
        }
      });
    }

    // Modal Fullscreen per Apertura Foto
    function openImageModal(imgSrc, isRotated = false) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      if (!modal || !modalImg) return;

      modalImg.src = imgSrc;
      
      if (isRotated) {
        modalImg.classList.add('rotate-90');
      } else {
        modalImg.classList.remove('rotate-90');
      }

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      if (modal) {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === "Escape") {
        closeImageModal();
      }
    });
  </script>
</body>
</html>
