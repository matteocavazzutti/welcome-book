<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Maria's Terrace</title>

  <!-- Framework grafico Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icone FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Icone Bandiere Flag Icons -->

  <style>
    .hidden-screen { display: none !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* Nasconde la barra di scorrimento orizzontale del menu pur mantenendo lo scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- ========================================== -->
  <!-- 1. LANDING PAGE: SELEZIONE LINGUA          -->
  <!-- ========================================== -->
  <div id="language-screen" class="min-h-screen flex flex-col justify-center items-center p-6 text-center bg-slate-50">
    
    <div class="mb-6 w-64 h-32 rounded-2xl overflow-hidden shadow-md border-4 border-white">
      <img src="1.t00gemR.png" alt="Terrazza di Maria" class="w-full h-full object-cover">
    </div>

    <h1 class="text-3xl font-bold text-slate-900 mb-2">Welcome to Maria's Terrace</h1>
    <p class="text-slate-500 text-sm mb-8">Choose your language / Scegli la tua lingua</p>

    <div class="w-full max-w-xs space-y-3">
      <button onclick="selectLanguage('en')" class="w-full bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100">
        <span class="font-semibold text-slate-700">English</span>
        <span class="fi fi-gb text-2xl rounded"></span>
      </button>

      <button onclick="selectLanguage('it')" class="w-full bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100">
        <span class="font-semibold text-slate-700">Italiano</span>
        <span class="fi fi-it text-2xl rounded"></span>
      </button>

      <button onclick="selectLanguage('fr')" class="w-full bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100">
        <span class="font-semibold text-slate-700">Français</span>
        <span class="fi fi-fr text-2xl rounded"></span>
      </button>

      <button onclick="selectLanguage('de')" class="w-full bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100">
        <span class="font-semibold text-slate-700">Deutsch</span>
        <span class="fi fi-de text-2xl rounded"></span>
      </button>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. APPLICAZIONE WELCOME BOOK               -->
  <!-- ========================================== -->
  <div id="app-screen" class="hidden-screen min-h-screen pb-28">
    
    <!-- Top Bar Sticky -->
    <header class="bg-slate-900 text-white p-5 rounded-b-3xl shadow-lg sticky top-0 z-50">
      <div class="max-w-md mx-auto flex justify-between items-center">
        <div>
          <h1 class="text-lg font-bold tracking-wide">Terrazza di Maria</h1>
          <p class="text-xs text-slate-400">Welcome Book</p>
        </div>
        
        <button onclick="showLanguageScreen()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2">
          <i class="fa-solid fa-globe text-amber-400"></i>
          <span id="current-lang-code" class="uppercase font-semibold">EN</span>
        </button>
      </div>
    </header>

    <!-- Contenuto Principale delle Sezioni -->
    <main class="max-w-md mx-auto p-4 space-y-4">

      <!-- 1. WELCOME -->
      <section id="welcome" class="tab-content active bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="text-center py-2 space-y-4">
          <i class="fa-solid fa-hand-wave text-4xl text-amber-500 mb-2"></i>
          <h2 id="txt-welcome-title" class="text-3xl font-bold text-amber-600 italic tracking-wide font-serif"></h2>
          <p id="txt-welcome-subtitle" class="text-slate-900 font-bold text-base leading-snug px-2"></p>
          <div id="txt-welcome-body" class="text-slate-600 text-sm leading-relaxed whitespace-pre-line text-left pt-2 space-y-3"></div>
          <div class="pt-4 text-center">
            <button onclick="showLanguageScreen()" class="inline-flex items-center gap-2 text-xs text-amber-600 font-semibold bg-amber-50 px-4 py-2 rounded-xl border border-amber-200">
              <i class="fa-solid fa-language"></i>
              <span id="txt-btn-change-lang"></span>
            </button>
          </div>
        </div>
      </section>

      <!-- 2. CONTACT POINT -->
      <section id="contact" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-amber-100 text-amber-600 rounded-xl">
            <i class="fa-solid fa-address-card text-xl"></i>
          </div>
          <h2 id="txt-contact-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="contact-content-container"></div>
      </section>

      <!-- 3. DISCLAIMER -->
      <section id="disclaimer" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-slate-100 text-slate-600 rounded-xl">
            <i class="fa-solid fa-shield-halved text-xl"></i>
          </div>
          <h2 id="txt-disclaimer-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <p id="txt-disclaimer-body" class="text-xs text-slate-500 leading-relaxed"></p>
      </section>

      <!-- 4. WIFI -->
      <section id="wifi" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-amber-100 text-amber-600 rounded-xl">
            <i class="fa-solid fa-wifi text-xl"></i>
          </div>
          <h2 id="txt-wifi-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="wifi-content-container"></div>
      </section>

      <!-- 5. YOUR ARRIVAL -->
      <section id="arrival" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-blue-100 text-blue-600 rounded-xl">
            <i class="fa-solid fa-map-location-dot text-xl"></i>
          </div>
          <h2 id="txt-arrival-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="arrival-content-container"></div>
      </section>

      <!-- 6. CHECK-IN -->
      <section id="checkin" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-emerald-100 text-emerald-600 rounded-xl">
            <i class="fa-solid fa-key text-xl"></i>
          </div>
          <h2 id="txt-checkin-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="checkin-content-container"></div>
      </section>

      <!-- 7. CHECK-OUT -->
      <section id="checkout" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-red-100 text-red-600 rounded-xl">
            <i class="fa-solid fa-door-open text-xl"></i>
          </div>
          <h2 id="txt-checkout-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="checkout-content-container"></div>
      </section>

      <!-- 8. HOUSE RULES -->
      <section id="rules" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-purple-100 text-purple-600 rounded-xl">
            <i class="fa-solid fa-clipboard-list text-xl"></i>
          </div>
          <h2 id="txt-rules-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="rules-content-container"></div>
      </section>

      <!-- 9. HOUSE GUIDE (MENU A TENDINA) -->
      <section id="guide" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-teal-100 text-teal-600 rounded-xl">
            <i class="fa-solid fa-book-open text-xl"></i>
          </div>
          <h2 id="txt-guide-title" class="text-xl font-bold text-slate-900">House Guide</h2>
        </div>

        <div id="guide-content-container"></div>
      </section>

      <!-- 10. TRANSPORTS / TOURIST INFO -->
      <section id="transports" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-indigo-100 text-indigo-600 rounded-xl">
            <i class="fa-solid fa-bus text-xl"></i>
          </div>
          <h2 id="txt-transports-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="transports-content-container"></div>
      </section>

      <!-- 11. BEST TIPS IN THE AREA -->
      <section id="tips" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-orange-100 text-orange-600 rounded-xl">
            <i class="fa-solid fa-utensils text-xl"></i>
          </div>
          <h2 id="txt-tips-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="tips-content-container"></div>
      </section>

      <!-- 12. EMERGENCY INFO -->
      <section id="emergency" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-rose-100 text-rose-600 rounded-xl">
            <i class="fa-solid fa-phone-volume text-xl"></i>
          </div>
          <h2 id="txt-emergency-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div id="emergency-content-container"></div>
      </section>

    </main>

    <!-- Navigazione fissa in basso -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-2 shadow-lg z-50">
      <div class="max-w-md mx-auto flex items-center overflow-x-auto no-scrollbar space-x-3 text-center px-2">
        <button onclick="showTab('welcome')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-house text-base block"></i><span id="nav-welcome" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('contact')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-address-card text-base block"></i><span id="nav-contact" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('wifi')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-wifi text-base block"></i><span id="nav-wifi" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('arrival')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-map-location-dot text-base block"></i><span id="nav-arrival" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('checkin')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-key text-base block"></i><span id="nav-checkin" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('checkout')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-door-open text-base block"></i><span id="nav-checkout" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('rules')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-clipboard-list text-base block"></i><span id="nav-rules" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('guide')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-book-open text-base block"></i><span id="nav-guide" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('transports')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-bus text-base block"></i><span id="nav-transports" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('tips')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-utensils text-base block"></i><span id="nav-tips" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('emergency')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-phone-volume text-base block"></i><span id="nav-emergency" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('disclaimer')" class="flex-shrink-0 p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-shield-halved text-base block"></i><span id="nav-disclaimer" class="text-[10px]"></span>
        </button>
      </div>
    </nav>

  </div>

    function toggleGuideSubSection(sectionId, iconId) {
      const el = document.getElementById(sectionId);
      const icon = document.getElementById(iconId);
      
      if (el) {
        const isHidden = el.classList.contains('hidden');
        
        // Chiude tutte le altre sezioni e ripristina le freccette
        document.querySelectorAll('.guide-subsection').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('[id^="icon-"]').forEach(i => i.classList.remove('rotate-180'));

        // Se era nascosto, lo apre e ruota la freccia
        if (isHidden) {
          el.classList.remove('hidden');
          if (icon) icon.classList.add('rotate-180');
        }
      }
    }
