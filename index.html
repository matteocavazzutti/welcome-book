    .hidden-screen { display: none !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* Personalizzazione Swiper Dock Apple */
    .swiper {
      width: 100%;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .swiper-slide {
      width: 68px !important;
      height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0.4;
      transform: scale(0.85);
      cursor: pointer;
    }
    /* Stile Icona Centrale Attiva (Apple Dock Style) */
    .swiper-slide-active {
      opacity: 1 !important;
      transform: scale(1.25) translateY(-2px) !important;
    }
    .swiper-slide-active i {
      color: #f59e0b !important; /* Colore Amber */
    }
    .swiper-slide-active span {
      color: #0f172a !important;

    function initSwiperNav() {
      if (navSwiper) return;

      navSwiper = new Swiper(".mySwiper", {
        slidesPerView: "auto",
        centeredSlides: true,
        spaceBetween: 10,
        loop: true,
        slideToClickedSlide: true,
        grabCursor: true,
        on: {
          slideChange: function () {
            const activeSlide = this.slides[this.activeIndex];
            if (activeSlide) {
              const tabId = activeSlide.getAttribute('data-tab');
              if (tabId && !isProgrammaticSlide) {
                switchTabContent(tabId);
              }
            }
          }
        }
      });
    }

    function switchTabContent(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      const activeTab = document.getElementById(tabId);
      if (activeTab) {
        activeTab.classList.add('active');
        window.scrollTo(0, 0);
      }
    }

    function showTab(tabId) {
      switchTabContent(tabId);
      if (navSwiper) {
        const slides = navSwiper.slides;
        for (let i = 0; i < slides.length; i++) {
          if (slides[i].getAttribute('data-tab') === tabId) {
            isProgrammaticSlide = true;
            navSwiper.slideToLoop(navSwiper.realIndex, 300);
            setTimeout(() => { isProgrammaticSlide = false; }, 350);
            break;
          }
        }
      }
    }

      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === "Escape") {
        closeImageModal();
      }
    });
  </script>
</body>
</html>
