<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benvenuti alla Terrazza di Maria</title>

  <!-- Framework grafico Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icone FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Icone Bandiere Flag Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>

  <!-- Swiper CSS per Navigazione -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    .hidden-screen { display: none !important; }
    
    /* Utility classes per nascondere scrollbar ma mantenere scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Supporto per area sicura iPhone (notch) */
    .pb-safe { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }

    /* Personalizzazione Bottoni Macro Menu */
    .macro-btn {
      transition: all 0.3s ease;
    }
    .macro-btn.active-macro {
      transform: scale(1.1) translateY(-2px);
    }

    /* Animazione Scuotimento per Errore PIN */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }
    .shake-animation {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans">

  <!-- ========================================== -->
  <!-- 0. AUTHENTICATION SCREEN                   -->
  <!-- ========================================== -->
  <div id="auth-screen" class="min-h-screen max-w-md mx-auto flex flex-col justify-center items-center p-6 text-center bg-slate-50 shadow-2xl relative">
    
    <div class="mb-6 w-full max-h-20 overflow-hidden pointer-events-none select-none">
      <img src="skyline-roma.png" alt="Roma Skyline" class="w-full h-auto object-contain mx-auto max-h-20">
    </div>

    <h1 class="text-xl font-bold text-slate-900 mb-2">Area Riservata / Restricted Area</h1>
    <p class="text-slate-500 text-sm mb-8">Inserisci il codice di accesso<br>Enter your access code</p>

    <!-- Caselle PIN -->
    <div id="pin-container" class="flex gap-3 mb-2" dir="ltr">
      <input type="tel" maxlength="1" class="pin-input w-14 h-16 text-center text-3xl font-bold text-slate-800 bg-white border-2 border-slate-200 rounded-xl focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all shadow-sm" data-index="0">
      <input type="tel" maxlength="1" class="pin-input w-14 h-16 text-center text-3xl font-bold text-slate-800 bg-white border-2 border-slate-200 rounded-xl focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all shadow-sm" data-index="1">
      <input type="tel" maxlength="1" class="pin-input w-14 h-16 text-center text-3xl font-bold text-slate-800 bg-white border-2 border-slate-200 rounded-xl focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all shadow-sm" data-index="2">
      <input type="tel" maxlength="1" class="pin-input w-14 h-16 text-center text-3xl font-bold text-slate-800 bg-white border-2 border-slate-200 rounded-xl focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all shadow-sm" data-index="3">
    </div>

    <!-- Messaggi di errore e blocco -->
    <p id="auth-error" class="text-rose-600 text-sm font-bold h-5 transition-opacity opacity-0 mt-2">Codice errato / Wrong code</p>
    <p id="auth-lockout-msg" class="text-amber-600 text-xs font-bold h-5 transition-opacity opacity-0 mt-1"></p>

  </div>

  <!-- ========================================== -->
  <!-- 1. LANDING PAGE: SELEZIONE LINGUA          -->
  <!-- ========================================== -->
  <div id="language-screen" class="hidden-screen min-h-screen max-w-md mx-auto flex flex-col justify-center items-center p-6 text-center bg-slate-50 shadow-2xl relative">
    
    <div class="mb-3 w-full max-h-20 overflow-hidden pointer-events-none select-none">
      <img src="skyline-roma.png" alt="Roma Skyline" class="w-full h-auto object-contain mx-auto max-h-20">
    </div>

    <div class="mb-5 w-64 h-32 rounded-2xl overflow-hidden shadow-md border-4 border-white cursor-zoom-in" onclick="openImageModal('Gemini_Generated_Image_1.png')">
      <img src="Gemini_Generated_Image_1.png" alt="Terrazza di Maria" class="w-full h-full object-cover">
    </div>

    <h1 class="text-2xl font-bold text-slate-900 mb-1">Benvenuti alla Terrazza di Maria</h1>
    <p class="text-slate-500 text-xs mb-6">Choose your language / Scegli la tua lingua</p>

    <div class="w-full max-w-xs space-y-2.5">
      <button type="button" onclick="selectLanguage('it')" class="w-full bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100 hover:border-amber-400 transition-all cursor-pointer">
        <span class="font-semibold text-sm text-slate-700">Italiano</span>
        <span class="fi fi-it text-2xl rounded"></span>
      </button>

      <button type="button" onclick="selectLanguage('en')" class="w-full bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100 hover:border-amber-400 transition-all cursor-pointer">
        <span class="font-semibold text-sm text-slate-700">English</span>
        <span class="fi fi-gb text-2xl rounded"></span>
      </button>

      <button type="button" onclick="selectLanguage('fr')" class="w-full bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100 hover:border-amber-400 transition-all cursor-pointer">
        <span class="font-semibold text-sm text-slate-700">Français</span>
        <span class="fi fi-fr text-2xl rounded"></span>
      </button>

      <button type="button" onclick="selectLanguage('de')" class="w-full bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100 hover:border-amber-400 transition-all cursor-pointer">
        <span class="font-semibold text-sm text-slate-700">Deutsch</span>
        <span class="fi fi-de text-2xl rounded"></span>
      </button>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. APPLICAZIONE WELCOME BOOK               -->
  <!-- ========================================== -->
  <!-- Utilizziamo h-[100dvh] per occupare sempre lo schermo nativo, evitando overflow del body -->
  <div id="app-screen" class="hidden-screen h-[100dvh] w-full max-w-md mx-auto relative bg-slate-50 shadow-2xl overflow-hidden flex flex-col">
    
    <!-- HEADER FISSO & MENU CAPITOLI (TOP TABS) -->
    <div class="absolute top-0 left-0 w-full z-40 flex flex-col">
      <header class="bg-slate-900 text-white p-5 rounded-b-3xl shadow-lg relative z-20">
        <div class="flex justify-between items-center">
          <div>
            <h1 class="text-lg font-bold tracking-wide">Terrazza di Maria</h1>
            <p class="text-xs text-slate-400">Welcome Book v41</p>
          </div>
          
          <button type="button" onclick="showLanguageScreen()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-globe text-amber-400"></i>
            <span id="current-lang-code" class="uppercase font-semibold">IT</span>
          </button>
        </div>
      </header>

      <!-- Sub-menu Orizzontale Dinamico -->
      <nav id="top-tabs-container" class="w-full overflow-x-auto no-scrollbar flex items-center gap-2 px-4 py-2.5 bg-slate-50/90 backdrop-blur-md border-b border-slate-200 shadow-sm relative z-10 -mt-2 pt-4">
        <!-- Popolato dinamicamente da JS -->
      </nav>
    </div>

    <!-- MAIN CONTENT SCORREVOLE (SWIPER AREA) -->
    <main class="flex-1 w-full h-full relative">
      
      <!-- GRUPPO 1: WELCOME -->
      <div id="swiper-welcome" class="swiper h-full w-full macro-swiper hidden">
        <div class="swiper-wrapper">
          <!-- Slide: Home -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="welcome">
            <section id="welcome" class="bg-white p-5 pt-3 rounded-2xl shadow-sm border border-slate-100">
              <div class="text-center space-y-3">
                <div class="w-full overflow-hidden rounded-xl pointer-events-none select-none">
                  <img src="skyline-roma.png" alt="Roma Skyline" class="w-full h-auto object-contain mx-auto max-h-20">
                </div>
                <div class="space-y-0.5">
                  <span id="txt-welcome-line1" class="block text-xl font-bold text-amber-600 italic tracking-wide font-serif"></span>
                  <span id="txt-welcome-line2" class="block text-2xl font-bold text-amber-600 italic tracking-wide font-serif"></span>
                </div>
                <p id="txt-welcome-subtitle" class="text-slate-900 font-bold text-sm leading-snug px-1"></p>
                <div id="txt-welcome-body" class="text-slate-600 text-xs leading-relaxed whitespace-pre-line text-left pt-1 space-y-2"></div>
                <div class="pt-3 pb-1">
                  <div class="grid grid-cols-4 grid-rows-2 gap-1.5 h-52 rounded-2xl overflow-hidden shadow-sm border border-slate-200/80 bg-slate-100 p-1">
                    <div class="col-span-2 row-span-2 overflow-hidden rounded-xl bg-slate-200 relative group cursor-zoom-in" onclick="openImageModal('Gemini_Generated_Image_1.png')">
                      <img src="Gemini_Generated_Image_1.png" alt="Tavolo Terrazzo al tramonto" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="col-span-1 row-span-1 overflow-hidden rounded-xl bg-slate-200 relative group cursor-zoom-in" onclick="openImageModal('Gemini_Generated_Image_7.jpeg')">
                      <img src="Gemini_Generated_Image_7.jpeg" alt="Solarium e sdraio" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="col-span-1 row-span-1 overflow-hidden rounded-xl bg-slate-200 relative group cursor-zoom-in" onclick="openImageModal('Gemini_Generated_Image_ 3.jpeg')">
                      <img src="Gemini_Generated_Image_ 3.jpeg" alt="Camera da letto matrimoniale" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="col-span-1 row-span-1 overflow-hidden rounded-xl bg-slate-200 relative group flex items-center justify-center cursor-zoom-in" onclick="openImageModal('Gemini_Generated_Image_ 2.jpeg', true)">
                      <img src="Gemini_Generated_Image_ 2.jpeg" alt="Panoramica Terrazzo" class="w-full h-full object-cover object-center rotate-90 scale-125 group-hover:scale-135 transition-transform duration-300">
                    </div>
                    <div class="col-span-1 row-span-1 overflow-hidden rounded-xl bg-slate-200 relative group cursor-zoom-in" onclick="openImageModal('Gemini_Generated_Image_ 4.png')">
                      <img src="Gemini_Generated_Image_ 4.png" alt="Sala da pranzo e soggiorno" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300">
                    </div>
                  </div>
                </div>
                <div class="pt-2 text-center">
                  <button type="button" onclick="showLanguageScreen()" class="inline-flex items-center gap-2 text-xs text-amber-600 font-semibold bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-xl border border-amber-200 transition-colors cursor-pointer">
                    <i class="fa-solid fa-language"></i>
                    <span id="txt-btn-change-lang"></span>
                  </button>
                </div>
              </div>
            </section>
          </div>
          <!-- Slide: Enjoy! -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="enjoy">
            <section id="enjoy" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-pink-100 text-pink-600 rounded-xl">
                  <i class="fa-solid fa-camera-retro text-xl"></i>
                </div>
                <h2 id="txt-enjoy-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="enjoy-content-container"></div>
            </section>
          </div>
        </div>
      </div>

      <!-- GRUPPO 2: EXPLORE ROME -->
      <div id="swiper-explore" class="swiper h-full w-full macro-swiper hidden">
        <div class="swiper-wrapper">
          <!-- Slide: Arrival -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="arrival">
            <section id="arrival" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-xl">
                  <i class="fa-solid fa-map-location-dot text-xl"></i>
                </div>
                <h2 id="txt-arrival-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="arrival-content-container"></div>
            </section>
          </div>
          <!-- Slide: Transports & Tours -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="transports">
            <section id="transports" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-indigo-100 text-indigo-600 rounded-xl">
                  <i class="fa-solid fa-bus text-xl"></i>
                </div>
                <h2 id="txt-transports-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="transports-content-container"></div>
            </section>
          </div>
          <!-- Slide: Local Tips -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="tips">
            <section id="tips" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-orange-100 text-orange-600 rounded-xl">
                  <i class="fa-solid fa-utensils text-xl"></i>
                </div>
                <h2 id="txt-tips-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="tips-content-container"></div>
            </section>
          </div>
          <!-- Slide: Local Services -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="local-services">
            <section id="local-services" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-emerald-100 text-emerald-600 rounded-xl">
                  <i class="fa-solid fa-location-dot text-xl"></i>
                </div>
                <h2 id="txt-local-services-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="local-services-content-container"></div>
            </section>
          </div>
        </div>
      </div>

      <!-- GRUPPO 3: THE HOUSE -->
      <div id="swiper-house" class="swiper h-full w-full macro-swiper hidden">
        <div class="swiper-wrapper">
          <!-- Slide: Check-in -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="checkin">
            <section id="checkin" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-emerald-100 text-emerald-600 rounded-xl">
                  <i class="fa-solid fa-key text-xl"></i>
                </div>
                <h2 id="txt-checkin-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="checkin-content-container"></div>
            </section>
          </div>
          <!-- Slide: Wi-Fi -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="wifi">
            <section id="wifi" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-amber-100 text-amber-600 rounded-xl">
                  <i class="fa-solid fa-wifi text-xl"></i>
                </div>
                <h2 id="txt-wifi-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="wifi-content-container"></div>
            </section>
          </div>
          <!-- Slide: House Rules -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="rules">
            <section id="rules" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-purple-100 text-purple-600 rounded-xl">
                  <i class="fa-solid fa-clipboard-list text-xl"></i>
                </div>
                <h2 id="txt-rules-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="rules-content-container"></div>
            </section>
          </div>
          <!-- Slide: House Guide -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="guide">
            <section id="guide" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-teal-100 text-teal-600 rounded-xl">
                  <i class="fa-solid fa-book-open text-xl"></i>
                </div>
                <h2 id="txt-guide-title" class="text-xl font-bold text-slate-900">House Guide</h2>
              </div>
              <div id="guide-content-container"></div>
            </section>
          </div>
          <!-- Slide: Check-out -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="checkout">
            <section id="checkout" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-red-100 text-red-600 rounded-xl">
                  <i class="fa-solid fa-door-open text-xl"></i>
                </div>
                <h2 id="txt-checkout-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="checkout-content-container"></div>
            </section>
          </div>
          <!-- Slide: Disclaimer -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="disclaimer">
            <section id="disclaimer" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-slate-100 text-slate-600 rounded-xl">
                  <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <h2 id="txt-disclaimer-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="disclaimer-content-container"></div>
            </section>
          </div>
        </div>
      </div>

      <!-- GRUPPO 4: SUPPORT -->
      <div id="swiper-support" class="swiper h-full w-full macro-swiper hidden">
        <div class="swiper-wrapper">
          <!-- Slide: Contact -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="contact">
            <section id="contact" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-amber-100 text-amber-600 rounded-xl">
                  <i class="fa-solid fa-address-card text-xl"></i>
                </div>
                <h2 id="txt-contact-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="contact-content-container"></div>
            </section>
          </div>
          <!-- Slide: Emergency -->
          <div class="swiper-slide h-full overflow-y-auto px-4 pt-[140px] pb-[100px] no-scrollbar" data-tab="emergency">
            <section id="emergency" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-rose-100 text-rose-600 rounded-xl">
                  <i class="fa-solid fa-phone-volume text-xl"></i>
                </div>
                <h2 id="txt-emergency-title" class="text-xl font-bold text-slate-900"></h2>
              </div>
              <div id="emergency-content-container"></div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <!-- MENU MACRO AREE (BOTTOM BAR) -->
    <nav class="absolute bottom-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)] pb-safe">
      <div class="grid grid-cols-4 h-[68px]">
        
        <button onclick="activateMacro('welcome')" id="btn-macro-welcome" class="macro-btn flex flex-col items-center justify-center text-amber-600 active-macro">
          <i class="fa-solid fa-hand-sparkles text-[22px] mb-1"></i>
          <span class="text-[10px] font-bold" id="txt-macro-welcome">Welcome</span>
        </button>

        <button onclick="activateMacro('explore')" id="btn-macro-explore" class="macro-btn flex flex-col items-center justify-center text-slate-400">
          <i class="fa-solid fa-map-location-dot text-[22px] mb-1"></i>
          <span class="text-[10px] font-bold" id="txt-macro-explore">Explore Rome</span>
        </button>

        <button onclick="activateMacro('house')" id="btn-macro-house" class="macro-btn flex flex-col items-center justify-center text-slate-400">
          <i class="fa-solid fa-house text-[22px] mb-1"></i>
          <span class="text-[10px] font-bold" id="txt-macro-house">The House</span>
        </button>

        <button onclick="activateMacro('support')" id="btn-macro-support" class="macro-btn flex flex-col items-center justify-center text-slate-400">
          <i class="fa-solid fa-life-ring text-[22px] mb-1"></i>
          <span class="text-[10px] font-bold" id="txt-macro-support">Support</span>
        </button>

      </div>
    </nav>
  </div>


  <!-- ========================================== -->
  <!-- 3. MODAL FULLSCREEN PER VISUALIZZAZIONE FOTO-->
  <!-- ========================================== -->
  <div id="image-modal" class="fixed inset-0 z-[100] bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeImageModal()">
    <button type="button" onclick="closeImageModal()" class="absolute top-4 right-4 text-white hover:text-amber-400 text-3xl font-bold p-2 transition-colors z-[101]">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="max-w-3xl max-h-[85vh] flex items-center justify-center" onclick="event.stopPropagation()">
      <img id="modal-img" src="" alt="Anteprima Ingrandita" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl transition-all duration-300">
    </div>
  </div>


  <!-- Swiper JS Script per la barra di navigazione -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    // ==========================================
    // LOGICA DI AUTENTICAZIONE E PROTEZIONE BOT
    // ==========================================
    const PIN_CODE = "1011";
    const AUTH_DURATION = 60 * 24 * 60 * 60 * 1000;
    const LOCKOUT_DURATION = 30 * 1000;
    const MAX_ATTEMPTS = 3;

    document.addEventListener("DOMContentLoaded", () => {
      checkAuth();
    });

    function checkAuth() {
      const authScreen = document.getElementById('auth-screen');
      const langScreen = document.getElementById('language-screen');
      const expiry = localStorage.getItem('terrazza_auth_expiry');

      if (expiry && parseInt(expiry) > Date.now()) {
        authScreen.classList.add('hidden-screen');
        langScreen.classList.remove('hidden-screen');
      } else {
        setupPinInputs();
        checkLockoutStatus();
      }
    }

    function setupPinInputs() {
      const inputs = document.querySelectorAll('.pin-input');
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
          if (e.target.value !== '') {
            if (index < inputs.length - 1) inputs[index + 1].focus();
            else validatePin();
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
          }
        });
      });
    }

    function validatePin() {
      const inputs = document.querySelectorAll('.pin-input');
      const enteredCode = Array.from(inputs).map(i => i.value).join('');
      const errorMsg = document.getElementById('auth-error');
      const pinContainer = document.getElementById('pin-container');
      
      if (enteredCode === PIN_CODE) {
        localStorage.setItem('terrazza_auth_expiry', Date.now() + AUTH_DURATION);
        localStorage.removeItem('terrazza_auth_attempts');
        document.getElementById('auth-screen').classList.add('hidden-screen');
        document.getElementById('language-screen').classList.remove('hidden-screen');
      } else {
        let attempts = parseInt(localStorage.getItem('terrazza_auth_attempts') || '0');
        attempts++;
        localStorage.setItem('terrazza_auth_attempts', attempts);
        errorMsg.classList.remove('opacity-0');
        pinContainer.classList.add('shake-animation');
        setTimeout(() => pinContainer.classList.remove('shake-animation'), 400);
        setTimeout(() => {
          errorMsg.classList.add('opacity-0');
          inputs.forEach(i => i.value = '');
          if (attempts >= MAX_ATTEMPTS) triggerLockout();
          else inputs[0].focus();
        }, 1000);
      }
    }

    function triggerLockout() {
      localStorage.setItem('terrazza_auth_lockout', Date.now() + LOCKOUT_DURATION);
      localStorage.setItem('terrazza_auth_attempts', '0');
      checkLockoutStatus();
    }

    function checkLockoutStatus() {
      const lockoutExpiry = parseInt(localStorage.getItem('terrazza_auth_lockout') || '0');
      const now = Date.now();
      const inputs = document.querySelectorAll('.pin-input');
      const lockoutMsg = document.getElementById('auth-lockout-msg');

      if (lockoutExpiry > now) {
        inputs.forEach(i => { i.disabled = true; i.classList.add('bg-slate-100', 'text-slate-400'); });
        lockoutMsg.classList.remove('opacity-0');
        const updateTimer = setInterval(() => {
          const remaining = Math.ceil((lockoutExpiry - Date.now()) / 1000);
          if (remaining <= 0) {
            clearInterval(updateTimer);
            lockoutMsg.classList.add('opacity-0');
            inputs.forEach(i => { 
              i.disabled = false; 
              i.classList.remove('bg-slate-100', 'text-slate-400'); 
              i.value = '';
            });
            inputs[0].focus();
          } else {
            lockoutMsg.innerText = `Too many attempts. Wait ${remaining}s`;
          }
        }, 1000);
      } else {
        inputs.forEach(i => { i.disabled = false; });
        if(document.getElementById('auth-screen').classList.contains('hidden-screen') === false) {
           inputs[0].focus();
        }
      }
    }

      'house': ['checkin', 'wifi', 'rules', 'guide', 'checkout', 'disclaimer'],

    const tabConfig = {
      'welcome': { icon: 'fa-house', key: 'navWelcome' },
      'arrival': { icon: 'fa-map-location-dot', key: 'navArrival' },
      'checkin': { icon: 'fa-key', key: 'navCheckin' },

      'contact': { icon: 'fa-address-card', key: 'navContact' },
      'emergency': { icon: 'fa-phone-volume', key: 'navEmergency' },
      'disclaimer': { icon: 'fa-shield-halved', key: 'navDisclaimer' }
    };

    let currentMacro = 'welcome';
    let swiperInstances = {};

    function initSwiperNav() {
      if (Object.keys(swiperInstances).length > 0) return; // Già inizializzato

      Object.keys(appStructure).forEach(macro => {
        swiperInstances[macro] = new Swiper(`#swiper-${macro}`, {
          slidesPerView: 1,
          spaceBetween: 0,
          loop: false, // Disattivato il loop per mantenere la logica strutturata
          grabCursor: true,
          on: {
            slideChange: function () {
              // Aggiorna l'UI del menu in alto solo se stiamo muovendo lo Swiper attivo
              if (currentMacro === macro) {
                updateTopTabsState(this.activeIndex);
              }
            }
          }
        });
      });
      
      // Imposta stato iniziale
      activateMacro('welcome');
    }

    function activateMacro(macroId) {
      currentMacro = macroId;
      
      // Aggiorna i colori del Bottom Menu
      document.querySelectorAll('.macro-btn').forEach(btn => {
        if (btn.id === `btn-macro-${macroId}`) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-amber-600', 'active-macro');
        } else {
          btn.classList.add('text-slate-400');
          btn.classList.remove('text-amber-600', 'active-macro');
        }
      });

      // Nascondi tutti gli Swiper Container, mostra quello attivo
      document.querySelectorAll('.macro-swiper').forEach(el => {
        if (el.id === `swiper-${macroId}`) {
          el.classList.remove('hidden');
          el.classList.add('block');
        } else {
          el.classList.remove('block');
          el.classList.add('hidden');
        }
      });

      // Renderizza e aggiorna i Tab in alto (Top Bar)
      renderTopTabs();
      
      // Forza l'aggiornamento grafico del layout Swiper attivo
      if (swiperInstances[macroId]) {
        swiperInstances[macroId].update();
        updateTopTabsState(swiperInstances[macroId].activeIndex);
      }
    }

    function renderTopTabs() {
      const container = document.getElementById('top-tabs-container');
      const chapters = appStructure[currentMacro];
      
      // Preleva il dizionario corretto
      const langCode = document.getElementById('current-lang-code').innerText.toLowerCase();
      const langData = translations[langCode] || translations['it'];

      container.innerHTML = chapters.map((tabId, index) => {
        const conf = tabConfig[tabId];
        const isActive = swiperInstances[currentMacro] ? (swiperInstances[currentMacro].activeIndex === index) : (index === 0);
        
        return `
          <button onclick="slideToTab(${index})" id="top-tab-${index}" class="flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 ${isActive ? 'bg-amber-100 border-amber-300 text-amber-800 font-bold shadow-sm' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">
            <i class="fa-solid ${conf.icon}"></i>
            <span class="text-[11px] whitespace-nowrap">${langData[conf.key]}</span>
          </button>
        `;
      }).join('');

      // Assicura che il tab attivo sia centrato visivamente
      if (swiperInstances[currentMacro]) {
        scrollTabIntoView(swiperInstances[currentMacro].activeIndex);
      }
    }

    function slideToTab(index) {
      if (swiperInstances[currentMacro]) {
        swiperInstances[currentMacro].slideTo(index);
      }
    }

    function updateTopTabsState(activeIndex) {
      const tabs = document.querySelectorAll('#top-tabs-container button');
      tabs.forEach((tab, index) => {
        if (index === activeIndex) {
          tab.className = "flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 bg-amber-100 border-amber-300 text-amber-800 font-bold shadow-sm";
        } else {
          tab.className = "flex items-center justify-center gap-2 px-4 py-2 rounded-full border transition-all flex-shrink-0 bg-white border-slate-200 text-slate-500 hover:bg-slate-50";
        }
      });
      scrollTabIntoView(activeIndex);
    }

    function scrollTabIntoView(index) {
      const container = document.getElementById('top-tabs-container');
      const tab = document.getElementById(`top-tab-${index}`);
      if (tab && container) {
        const scrollLeft = tab.offsetLeft - (container.offsetWidth / 2) + (tab.offsetWidth / 2);
        container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
      }
    }

    function toggleFoodDrinkSubSection(sectionId, btnElement) {
      const targetContent = document.getElementById(sectionId);
      if (!targetContent) return;
      const isHidden = targetContent.classList.contains('hidden');
      document.querySelectorAll('.food-drink-subsection').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.food-drink-icon').forEach(icon => icon.style.transform = 'rotate(0deg)');
      if (isHidden) {
        targetContent.classList.remove('hidden');
        if (btnElement) {
          const icon = btnElement.querySelector('.food-drink-icon');
          if (icon) icon.style.transform = 'rotate(180deg)';
        }
      }
    }

    // ==========================================
    // AGGIORNAMENTO LINGUA
    // ==========================================

    function selectLanguage(lang) {
      const codeEl = document.getElementById('current-lang-code');
      if (codeEl) codeEl.innerText = lang;
      
      const t = translations[lang] || translations['it'];

      // Text updates
      const line1 = document.getElementById('txt-welcome-line1');
      if (line1) line1.innerText = t.welcomeLine1 || '';
      
      const line2 = document.getElementById('txt-welcome-line2');
      if (line2) line2.innerText = t.welcomeLine2 || '';

      const subTitle = document.getElementById('txt-welcome-subtitle');
      if (subTitle) subTitle.innerText = t.welcomeSubtitle || '';

      const body = document.getElementById('txt-welcome-body');
      if (body) body.innerText = t.welcomeBody || '';

      const btnChange = document.getElementById('txt-btn-change-lang');
      if (btnChange) btnChange.innerText = t.changeLangBtn || '';

      // Aggiorna testi bottoni macro
      document.getElementById('txt-macro-welcome').innerText = t.macroWelcome || 'Welcome';
      document.getElementById('txt-macro-explore').innerText = t.macroExplore || 'Explore Rome';
      document.getElementById('txt-macro-house').innerText = t.macroHouse || 'The House';
      document.getElementById('txt-macro-support').innerText = t.macroSupport || 'Support';

      // Dinamici
      const arrTitle = document.getElementById('txt-arrival-title');
      if (arrTitle) arrTitle.innerText = t.arrivalTitle || '';
      renderArrivalSection(lang);

      const chkTitle = document.getElementById('txt-checkin-title');
      if (chkTitle) chkTitle.innerText = t.checkinTitle || '';
      renderCheckinSection(lang);

      const wifiTitle = document.getElementById('txt-wifi-title');
      if (wifiTitle) wifiTitle.innerText = t.wifiTitle || '';
      renderWifiSection(lang);

      const rulesTitle = document.getElementById('txt-rules-title');
      if (rulesTitle) rulesTitle.innerText = t.rulesTitle || '';
      renderRulesSection(lang);

      const guideTitle = document.getElementById('txt-guide-title');
      if (guideTitle) guideTitle.innerText = t.guideTitle || '';
      renderGuideSection(lang);

      const transTitle = document.getElementById('txt-transports-title');
      if (transTitle) transTitle.innerText = t.transportsTitle || '';
      renderTransportsSection(lang);

      const tipsTitle = document.getElementById('txt-tips-title');
      if (tipsTitle) tipsTitle.innerText = t.tipsTitle || '';
      renderFoodDrinkSection(lang);
      
      const enjoyTitle = document.getElementById('txt-enjoy-title');
      if (enjoyTitle) enjoyTitle.innerText = t.enjoyTitle || 'Enjoy!';
      renderEnjoySection(lang);

      const localTitle = document.getElementById('txt-local-services-title');
      if (localTitle) localTitle.innerText = t.localServicesTitle || '';
      renderLocalServicesSection(lang);

      const outTitle = document.getElementById('txt-checkout-title');
      if (outTitle) outTitle.innerText = t.checkoutTitle || '';
      renderCheckoutSection(lang);

      const contactTitle = document.getElementById('txt-contact-title');
      if (contactTitle) contactTitle.innerText = t.contactTitle || '';
      renderContactSection(lang);

      const emergTitle = document.getElementById('txt-emergency-title');
      if (emergTitle) emergTitle.innerText = t.emergencyTitle || '';
      renderEmergencySection(lang);

      const discTitle = document.getElementById('txt-disclaimer-title');
      if (discTitle) discTitle.innerText = t.disclaimerTitle || '';
      renderDisclaimerSection(lang);

      const langScreen = document.getElementById('language-screen');
      const appScreen = document.getElementById('app-screen');
      
      if (langScreen) langScreen.classList.add('hidden-screen');
      if (appScreen) appScreen.classList.remove('hidden-screen');
      
      // Inizializza swiper e renderizza le Top Tabs per la lingua scelta
      setTimeout(() => {
        initSwiperNav();
        renderTopTabs();
      }, 50);
    }

    function showLanguageScreen() {
      const appScreen = document.getElementById('app-screen');
      const langScreen = document.getElementById('language-screen');
      if (appScreen) appScreen.classList.add('hidden-screen');
      if (langScreen) langScreen.classList.remove('hidden-screen');
    }

    function copyWifiPassword(password, feedbackId) {
      navigator.clipboard.writeText(password).then(() => {
        const feedback = document.getElementById(feedbackId);
        if (feedback) {
          feedback.classList.remove('hidden');
          setTimeout(() => feedback.classList.add('hidden'), 3000);
        }
      });
    }

    // Modal Fullscreen per Apertura Foto
    function openImageModal(imgSrc, isRotated = false) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      if (!modal || !modalImg) return;
      modalImg.src = imgSrc;
      if (isRotated) modalImg.classList.add('rotate-90');
      else modalImg.classList.remove('rotate-90');
      modal.classList.remove('hidden');
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      if (modal) modal.classList.add('hidden');
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === "Escape") closeImageModal();
    });

  </script>
</body>
</html>
