<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benvenuti alla Terrazza di Maria</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>

  <style>
    /* Nasconde completamente gli elementi che non devono essere visti */
    .hidden-screen { display: none !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- ========================================== -->
  <!-- 1. CHOOSE YOUR LANGUAGE (LANDING PAGE)     -->
  <!-- ========================================== -->
  <div id="language-screen" class="min-h-screen flex flex-col justify-center items-center p-6 text-center bg-slate-50">
    
    <div class="mb-6 p-4 bg-amber-100 text-amber-600 rounded-full shadow-inner">
      <i class="fa-solid fa-house-user text-4xl"></i>
    </div>

    <h1 class="text-3xl font-bold text-slate-900 mb-2">Benvenuti alla Terrazza di Maria</h1>
    <p class="text-slate-500 text-sm mb-8">Choose your language / Scegli la tua lingua</p>

    <div class="w-full max-w-xs space-y-3">
      <button onclick="selectLanguage('it')" class="w-full bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100">
        <span class="font-semibold text-slate-700">Italiano</span>
        <span class="fi fi-it text-2xl rounded"></span>
      </button>

      <button onclick="selectLanguage('en')" class="w-full bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100">
        <span class="font-semibold text-slate-700">English</span>
        <span class="fi fi-gb text-2xl rounded"></span>
      </button>

      <button onclick="selectLanguage('fr')" class="w-full bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100">
        <span class="font-semibold text-slate-700">Français</span>
        <span class="fi fi-fr text-2xl rounded"></span>
      </button>

      <button onclick="selectLanguage('de')" class="w-full bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100">
        <span class="font-semibold text-slate-700">Deutsch</span>
        <span class="fi fi-de text-2xl rounded"></span>
      </button>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. APPLICAZIONE WELCOME BOOK (SCHERMO INTERO) -->
  <!-- ========================================== -->
  <div id="app-screen" class="hidden-screen min-h-screen pb-24">
    
    <!-- Top Bar Sticky -->
    <header class="bg-slate-900 text-white p-5 rounded-b-3xl shadow-lg sticky top-0 z-50">
      <div class="max-w-md mx-auto flex justify-between items-center">
        <div>
          <h1 class="text-lg font-bold tracking-wide">Terrazza di Maria</h1>
          <p class="text-xs text-slate-400">Welcome Book</p>
        </div>
        
        <!-- Pulsante Torna a Scelta Lingua -->
        <button onclick="showLanguageScreen()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2">
          <i class="fa-solid fa-globe text-amber-400"></i>
          <span id="current-lang-code" class="uppercase font-semibold">IT</span>
        </button>
      </div>
    </header>

    <!-- Contenuto della pagina principale -->
    <main class="max-w-md mx-auto p-4 space-y-4">

      <!-- Section: Benvenuti -->
      <section id="welcome" class="tab-content active bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="text-center py-4">
          <i class="fa-solid fa-hand-wave text-4xl text-amber-500 mb-3"></i>
          <h2 id="txt-welcome-title" class="text-2xl font-bold text-slate-900 mb-2"></h2>
          <p id="txt-welcome-body" class="text-slate-600 text-sm leading-relaxed mb-6"></p>

          <!-- Tasto separato per tornare alla scelta lingua -->
          <button onclick="showLanguageScreen()" class="inline-flex items-center gap-2 text-xs text-amber-600 font-semibold bg-amber-50 px-4 py-2 rounded-xl border border-amber-200">
            <i class="fa-solid fa-language"></i>
            <span id="txt-btn-change-lang"></span>
          </button>
        </div>
      </section>

      <!-- Section: Wi-Fi -->
      <section id="wifi" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-amber-100 text-amber-600 rounded-xl">
            <i class="fa-solid fa-wifi text-xl"></i>
          </div>
          <h2 id="txt-wifi-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
          <div>
            <span id="txt-wifi-name-lbl" class="text-xs text-slate-400 uppercase font-semibold block mb-1"></span>
            <p class="font-mono font-bold text-slate-800 text-lg">TerrazzaMaria_WiFi</p>
          </div>
          <div>
            <span id="txt-wifi-pass-lbl" class="text-xs text-slate-400 uppercase font-semibold block mb-1"></span>
            <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-slate-200">
              <span id="wifi-pass" class="font-mono font-bold text-amber-600">WelcomeMaria2026!</span>
              <button onclick="copyPassword()" class="bg-amber-500 text-white text-xs px-3 py-1.5 rounded-md font-semibold">
                <i class="fa-regular fa-copy"></i> <span id="txt-btn-copy"></span>
              </button>
            </div>
            <p id="copy-feedback" class="text-xs text-emerald-600 font-medium mt-1 hidden"></p>
          </div>
        </div>
      </section>

      <!-- Section: Disclaimer -->
      <section id="disclaimer" class="tab-content bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center space-x-3 mb-4">
          <div class="p-3 bg-slate-100 text-slate-600 rounded-xl">
            <i class="fa-solid fa-shield-halved text-xl"></i>
          </div>
          <h2 id="txt-disclaimer-title" class="text-xl font-bold text-slate-900"></h2>
        </div>
        <p id="txt-disclaimer-body" class="text-xs text-slate-500 leading-relaxed"></p>
      </section>

    </main>

    <!-- Navigazione fissa in basso -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 shadow-lg z-50">
      <div class="max-w-md mx-auto flex justify-between items-center overflow-x-auto text-center">
        <button onclick="showTab('welcome')" class="p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-house text-lg block"></i><span id="nav-welcome" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('wifi')" class="p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-wifi text-lg block"></i><span id="nav-wifi" class="text-[10px]"></span>
        </button>
        <button onclick="showTab('disclaimer')" class="p-2 text-slate-500 hover:text-amber-500">
          <i class="fa-solid fa-shield-halved text-lg block"></i><span id="nav-disclaimer" class="text-[10px]"></span>
        </button>
      </div>
    </nav>

  </div>


  <!-- ========================================== -->
  <!-- 3. LOGICA DI CAMBIO SCHERMATA & LINGUE     -->
  <!-- ========================================== -->
  <script>
    const translations = {
      it: {
        welcomeTitle: "Benvenuti!",
        welcomeBody: "Siamo felici di ospitarvi alla Terrazza di Maria. Abbiamo preparato questa guida per rendervi il soggiorno confortevole e piacevole.",
        changeLangBtn: "Cambia Lingua / Change Language",
        wifiTitle: "Connessione Wi-Fi",
        wifiNameLbl: "Nome Rete (SSID)",
        wifiPassLbl: "Password",
        btnCopy: "Copia",
        copySuccess: "✓ Password copiata!",
        disclaimerTitle: "Disclaimer",
        disclaimerBody: "La struttura declina ogni responsabilità per eventuali smarrimenti di oggetti personali lasciati incustoditi.",
        navWelcome: "Home",
        navWifi: "Wi-Fi",
        navDisclaimer: "Info Legal"
      },
      en: {
        welcomeTitle: "Welcome!",
        welcomeBody: "We are delighted to host you at Terrazza di Maria. We created this guide to make your stay as comfortable as possible.",
        changeLangBtn: "Change Language",
        wifiTitle: "Wi-Fi Network",
        wifiNameLbl: "Network Name (SSID)",
        wifiPassLbl: "Password",
        btnCopy: "Copy",
        copySuccess: "✓ Password copied!",
        disclaimerTitle: "Disclaimer",
        disclaimerBody: "Management is not responsible for any lost or stolen personal belongings left unattended.",
        navWelcome: "Home",
        navWifi: "Wi-Fi",
        navDisclaimer: "Disclaimer"
      },
      fr: {
        welcomeTitle: "Bienvenue !",
        welcomeBody: "Nous sommes ravis de vous accueillir à la Terrazza di Maria. Cette guide est là pour vous aider durant votre séjour.",
        changeLangBtn: "Changer de langue",
        wifiTitle: "Réseau Wi-Fi",
        wifiNameLbl: "Nom du réseau (SSID)",
        wifiPassLbl: "Mot de passe",
        btnCopy: "Copier",
        copySuccess: "✓ Mot de passe copié !",
        disclaimerTitle: "Avertissement",
        disclaimerBody: "L'établissement décline toute responsabilité en cas de perte de vos effets personnels.",
        navWelcome: "Accueil",
        navWifi: "Wi-Fi",
        navDisclaimer: "Info"
      },
      de: {
        welcomeTitle: "Willkommen!",
        welcomeBody: "Wir freuen uns, Sie in der Terrazza di Maria begrüßen zu dürfen. Dieser Reiseführer soll Ihren Aufenthalt verschönern.",
        changeLangBtn: "Sprache ändern",
        wifiTitle: "WLAN-Netzwerk",
        wifiNameLbl: "Netzwerkname (SSID)",
        wifiPassLbl: "Passwort",
        btnCopy: "Kopieren",
        copySuccess: "✓ Passwort kopiert!",
        disclaimerTitle: "Haftungsausschluss",
        disclaimerBody: "Für den Verlust von persönlichen Gegenständen wird keine Haftung übernommen.",
        navWelcome: "Start",
        navWifi: "WLAN",
        navDisclaimer: "Info"
      }
    };

    function selectLanguage(lang) {
      document.getElementById('current-lang-code').innerText = lang;
      const t = translations[lang] || translations['it'];

      // Inserisce i testi
      document.getElementById('txt-welcome-title').innerText = t.welcomeTitle;
      document.getElementById('txt-welcome-body').innerText = t.welcomeBody;
      document.getElementById('txt-btn-change-lang').innerText = t.changeLangBtn;

      document.getElementById('txt-wifi-title').innerText = t.wifiTitle;
      document.getElementById('txt-wifi-name-lbl').innerText = t.wifiNameLbl;
      document.getElementById('txt-wifi-pass-lbl').innerText = t.wifiPassLbl;
      document.getElementById('txt-btn-copy').innerText = t.btnCopy;
      document.getElementById('copy-feedback').innerText = t.copySuccess;

      document.getElementById('txt-disclaimer-title').innerText = t.disclaimerTitle;
      document.getElementById('txt-disclaimer-body').innerText = t.disclaimerBody;

      document.getElementById('nav-welcome').innerText = t.navWelcome;
      document.getElementById('nav-wifi').innerText = t.navWifi;
      document.getElementById('nav-disclaimer').innerText = t.navDisclaimer;

      // NASCONDE la pagina iniziale e MOSTRA l'app a schermo intero in cima alla pagina
      document.getElementById('language-screen').classList.add('hidden-screen');
      document.getElementById('app-screen').classList.remove('hidden-screen');
      
      showTab('welcome');
      window.scrollTo(0, 0);
    }

    function showLanguageScreen() {
      // NASCONDE l'app e MOSTRA la landing page iniziale
      document.getElementById('app-screen').classList.add('hidden-screen');
      document.getElementById('language-screen').classList.remove('hidden-screen');
      window.scrollTo(0, 0);
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function copyPassword() {
      const password = document.getElementById('wifi-pass').innerText;
      navigator.clipboard.writeText(password).then(() => {
        const feedback = document.getElementById('copy-feedback');
        feedback.classList.remove('hidden');
        setTimeout(() => feedback.classList.add('hidden'), 3000);
      });
    }
  </script>
</body>
</html>
