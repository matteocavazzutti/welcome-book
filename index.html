<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benvenuti alla Terrazza di Maria</title>

  <!-- Framework grafico Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icone FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>

  <!-- Swiper CSS per Navigazione Circolare -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    .hidden-screen { display: none !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* Personalizzazione Swiper Dock Apple */
    .swiper {
      width: 100%;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    .swiper-slide {
      width: 68px !important;
      height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0.4;
      transform: scale(0.85);
      cursor: pointer;
    }
    /* Stile Icona Centrale Attiva (Apple Dock Style) */
    .swiper-slide-active, .swiper-slide.dock-active {
      opacity: 1 !important;
      transform: scale(1.25) translateY(-2px) !important;
    }
    .swiper-slide-active i, .swiper-slide.dock-active i {
      color: #f59e0b !important; /* Colore Amber */
    }
    .swiper-slide-active span, .swiper-slide.dock-active span {
      color: #0f172a !important;
      font-weight: 700 !important;
    }
  </style>

<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- ======================================================= -->
  <!-- 0. SCHERMATA DI AUTENTICAZIONE CON PIN (ACCESSO PROTETTO) -->

  <div id="auth-screen" class="min-h-screen flex flex-col justify-center items-center p-6 text-center bg-slate-900 text-white">

      </div>

      <div>
        <h2 class="text-xl font-bold text-slate-100">Accesso Riservato</h2>
        <p class="text-xs text-slate-400 mt-1">Inserisci il PIN a 4 cifre per accedere al Welcome Book</p>

        <input type="password" maxlength="1" inputmode="numeric" class="pin-box w-12 h-14 text-center text-2xl font-bold rounded-xl bg-slate-900 border-2 border-slate-700 text-white focus:border-amber-500 focus:outline-none transition-colors" autofocus>

      <p class="text-[10px] text-slate-500 pt-1">L'accesso rimarrà memorizzato su questo dispositivo per 3 mesi.</p>

  <!-- 1. LANDING PAGE: SELEZIONE LINGUA          -->

        <span class="fi fi-gb text-2xl rounded"></span>

      <button type="button" onclick="selectLanguage('fr')" class="w-full bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between active:bg-slate-100 hover:border-amber-400 transition-all cursor-pointer">

        <span class="fi fi-fr text-2xl rounded"></span>

    // -------------------------------------------------------------
    const CORRECT_PIN_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
    const AUTH_KEY = "terrazza_auth_hash";
    const MAX_ATTEMPTS = 3;
    const LOCKOUT_MINUTES = 5;

    const pinInputs = document.querySelectorAll('.pin-box');
    const pinErrorEl = document.getElementById('pin-error-msg');
    let lockoutTimer = null;

    async function computeHash(text) {
      const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function checkLockoutState() {
      const lockUntil = localStorage.getItem('pin_lock_until');
      if (!lockUntil) return false;

      const diff = parseInt(lockUntil, 10) - Date.now();
      if (diff > 0) {
        setLockoutUI(diff);
        return true;
      }

      localStorage.removeItem('pin_lock_until');
      localStorage.removeItem('pin_error_count');
      pinInputs.forEach(input => input.disabled = false);
      if (pinErrorEl) pinErrorEl.textContent = "";
      if (pinInputs[0]) pinInputs[0].focus();
      return false;
    }

    function setLockoutUI(remainingMs) {
      pinInputs.forEach(input => {
        input.value = "";
        input.disabled = true;
      });

      clearInterval(lockoutTimer);
      displayCountdown(remainingMs);

      lockoutTimer = setInterval(() => {
        const currentDiff = parseInt(localStorage.getItem('pin_lock_until') || '0', 10) - Date.now();
        if (currentDiff <= 0) {
          clearInterval(lockoutTimer);
          checkLockoutState();
        } else {
          displayCountdown(currentDiff);
        }
      }, 1000);
    }

    function displayCountdown(ms) {
      const sec = Math.ceil(ms / 1000);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      if (pinErrorEl) {
        pinErrorEl.textContent = `Troppi tentativi errati. Riprova tra ${m}:${s < 10 ? '0' : ''}${s}`;
      }
    }

    async function onPinDigit() {
      if (checkLockoutState()) return;

      const enteredPin = Array.from(pinInputs).map(i => i.value).join('');
      if (enteredPin.length === 4) {
        const hashed = await computeHash(enteredPin);

        if (hashed === CORRECT_PIN_HASH) {
          const expireAt = Date.now() + (90 * 24 * 60 * 60 * 1000);
          localStorage.setItem(AUTH_KEY, JSON.stringify({ hash: hashed, expire: expireAt }));
          localStorage.removeItem('pin_error_count');
          localStorage.removeItem('pin_lock_until');
          
          showScreen('language-screen');
        } else {
          let errors = parseInt(localStorage.getItem('pin_error_count') || '0', 10) + 1;
          localStorage.setItem('pin_error_count', errors);

          if (errors >= MAX_ATTEMPTS) {
            const lockTime = Date.now() + (LOCKOUT_MINUTES * 60 * 1000);
            localStorage.setItem('pin_lock_until', lockTime);
            checkLockoutState();
          } else {
            const left = MAX_ATTEMPTS - errors;
            if (pinErrorEl) pinErrorEl.textContent = `PIN errato. Tentativi rimasti: ${left}`;
            pinInputs.forEach(i => i.value = "");
            if (pinInputs[0]) pinInputs[0].focus();
          }
        }
      }
    }

    pinInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        if (pinErrorEl && !localStorage.getItem('pin_lock_until')) pinErrorEl.textContent = "";
        if (e.target.value && idx < pinInputs.length - 1) {
          pinInputs[idx + 1].focus();
        }
        onPinDigit();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          pinInputs[idx - 1].focus();
        }
      });
    });

    function isUserAuthenticated() {
      try {
        const saved = localStorage.getItem(AUTH_KEY);
        if (!saved) return false;
        const authData = JSON.parse(saved);
        if (authData.hash === CORRECT_PIN_HASH && authData.expire > Date.now()) {
          return true;
        }
      } catch (err) {
        return false;
      }
      return false;
    }

    function logoutPin() {
      localStorage.removeItem(AUTH_KEY);
      pinInputs.forEach(i => i.value = "");
      if (pinErrorEl) pinErrorEl.textContent = "";
      showScreen('auth-screen');
      setTimeout(() => { if (pinInputs[0]) pinInputs[0].focus(); }, 100);
    }

    function showScreen(screenId) {
      document.getElementById('auth-screen').classList.add('hidden-screen');
      document.getElementById('language-screen').classList.add('hidden-screen');
      document.getElementById('app-screen').classList.add('hidden-screen');

      const target = document.getElementById(screenId);
      if (target) target.classList.remove('hidden-screen');
      window.scrollTo(0, 0);
    }

    // Controllo iniziale all'avvio
    if (isUserAuthenticated()) {
      showScreen('language-screen');
    } else {
      showScreen('auth-screen');
      checkLockoutState();
    }

    // -------------------------------------------------------------
    // GESTIONE DIZIONARI, TRADUZIONI & CONTENUTI DELL'APP
    // -------------------------------------------------------------
    function initSwiperNav() {
      if (!navSwiper) {
        navSwiper = new Swiper(".mySwiper", {
          slidesPerView: "auto",
          centeredSlides: true,
          spaceBetween: 6,
          freeMode: false,
          grabCursor: true
        });
      } else {
        navSwiper.update();
      }
    }

    function navigateToTab(tabId) {
      // 1. Mostra il contenuto del tab
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      const activeTab = document.getElementById(tabId);
      if (activeTab) {
        activeTab.classList.add('active');
        window.scrollTo(0, 0);
      }

      // 2. Aggiorna la classe visiva attiva sui pulsanti dock
      const slides = document.querySelectorAll('.swiper-slide');
      slides.forEach((slide, index) => {
        if (slide.getAttribute('data-tab') === tabId) {
          slide.classList.add('dock-active');
          if (navSwiper) {
            navSwiper.slideTo(index, 300);
          }
        } else {
          slide.classList.remove('dock-active');
        }
      });
    }

    function selectLanguage(lang) {
      // 1. Cambio schermata immediato
      showScreen('app-screen');

      // 2. Aggiornamento codice lingua
      const codeEl = document.getElementById('current-lang-code');
      if (codeEl) codeEl.innerText = lang;
      
      const t = translations[lang] || translations['it'];

      // 3. Mappatura testi Welcome
      const line1 = document.getElementById('txt-welcome-line1');
      if (line1) line1.innerText = t.welcomeLine1 || '';
      
      const line2 = document.getElementById('txt-welcome-line2');
      if (line2) line2.innerText = t.welcomeLine2 || '';

      const subTitle = document.getElementById('txt-welcome-subtitle');
      if (subTitle) subTitle.innerText = t.welcomeSubtitle || '';

      const body = document.getElementById('txt-welcome-body');
      if (body) body.innerText = t.welcomeBody || '';

      const btnChange = document.getElementById('txt-btn-change-lang');
      if (btnChange) btnChange.innerText = t.changeLangBtn || '';

      // 4. Rendering delle sezioni complete
      renderArrivalSection(lang);
      renderCheckinSection(lang);
      renderWifiSection(lang);
      renderRulesSection(lang);
      renderGuideSection(lang);
      renderTransportsSection(lang);
      renderFoodDrinkSection(lang);
      renderLocalServicesSection(lang);
      renderCheckoutSection(lang);
      renderContactSection(lang);
      renderEmergencySection(lang);
      renderDisclaimerSection(lang);

      // 5. Etichette dock
      const setNavText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.innerText = text || '';
      };

      setNavText('nav-welcome', t.navWelcome);
      setNavText('nav-arrival', t.navArrival);
      setNavText('nav-checkin', t.navCheckin);
      setNavText('nav-wifi', t.navWifi);
      setNavText('nav-rules', t.navRules);
      setNavText('nav-guide', t.navGuide);
      setNavText('nav-transports', t.navTransports);
      setNavText('nav-tips', t.navTips);
      setNavText('nav-local-services', t.navLocalServices);
      setNavText('nav-checkout', t.navCheckout);
      setNavText('nav-contact', t.navContact);
      setNavText('nav-emergency', t.navEmergency);
      setNavText('nav-disclaimer', t.navDisclaimer);

      // 6. Inizializzazione Swiper dock a schermo visibile
      setTimeout(() => {
        initSwiperNav();
        navigateToTab('welcome');
      }, 50);
    }

    function showLanguageScreen() {
      showScreen('language-screen');
    }

    function copyWifiPassword(password, feedbackId) {
      navigator.clipboard.writeText(password).then(() => {
        const feedback = document.getElementById(feedbackId);
        if (feedback) {
          feedback.classList.remove('hidden');
          setTimeout(() => feedback.classList.add('hidden'), 3000);
        }
      });
    }

    // Modal Fullscreen per Apertura Foto
    function openImageModal(imgSrc, isRotated = false) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      if (!modal || !modalImg) return;

      modalImg.src = imgSrc;
      
      if (isRotated) {
        modalImg.classList.add('rotate-90');
      } else {
        modalImg.classList.remove('rotate-90');
      }

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      if (modal) {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === "Escape") {
        closeImageModal();
      }
    });
  </script>
</body>
</html>
