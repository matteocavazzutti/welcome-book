    function showLanguageScreen() {
      document.getElementById('app-screen').classList.add('hidden-screen');
      document.getElementById('language-screen').classList.remove('hidden-screen');
      window.scrollTo(0, 0);
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function copyPassword() {
      const password = document.getElementById('wifi-pass').innerText;
      navigator.clipboard.writeText(password).then(() => {
        const feedback = document.getElementById('copy-feedback');
        feedback.classList.remove('hidden');
        setTimeout(() => feedback.classList.add('hidden'), 3000);
      });
    }
    
function generaLinkTrenitalia(origine, destinazione) {
  const oggi = new Date();
  
  const dd = String(oggi.getDate()).padStart(2, '0');
  const mm = String(oggi.getMonth() + 1).padStart(2, '0');
  const yyyy = oggi.getFullYear();
  const hh = String(oggi.getHours()).padStart(2, '0');
  
  const dataFormattata = `${dd}%2F${mm}%2F${yyyy}`; // Formato GG/MM/AAAA codificato
  
  // URL corretto che punta alla ricerca soluzioni Trenitalia
  return `https://www.trenitalia.com/it/soluzioni-di-viaggio.html?departure=${encodeURIComponent(origine)}&arrival=${encodeURIComponent(destinazione)}&date=${dataFormattata}&time=${hh}`;
}
